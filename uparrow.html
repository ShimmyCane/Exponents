<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Up-Arrow Towers</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #0a1020; }
    * { box-sizing: border-box; }
    .bt { cursor: pointer; border: none; transition: all .18s; }
    .bt:hover { filter: brightness(1.25); }
    .nav-btn:hover:not(:disabled) { filter: brightness(1.3); transform: scale(1.08); }
    .nav-btn:active:not(:disabled) { transform: scale(0.92); }
    .tool { cursor: pointer; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 11px; text-decoration: none;
            height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; background: transparent; }
    .tool:hover { filter: brightness(1.35); }

    /* tower levels: the wrapper glides, the inner glyph pops in when born */
    .lvl { position: absolute; left: 0; bottom: 0; transform-origin: 0 100%; white-space: nowrap;
           transition: transform 0.9s cubic-bezier(0.4,0,0.2,1), color 0.6s, text-shadow 0.6s; }
    .lvl > span { display: inline-block; animation: born 0.8s cubic-bezier(0.34,1.4,0.64,1) both; }
    @keyframes born { from { opacity: 0; transform: translate(-0.4em, 0.6em) scale(1.5); } to { opacity: 1; transform: none; } }

    .row { animation: rowIn 0.6s ease both; }
    .row.fresh { animation: rowIn 0.6s ease both, glow 1.4s ease 0.6s both; }
    @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes glow { 0% { background: var(--glow); } 100% { background: transparent; } }

    sup.p { font-size: 0.68em; vertical-align: 0.55em; line-height: 0; }
    .series:hover { filter: brightness(1.3); }
    .edge-arrow:hover { filter: brightness(1.35); }
    @media (max-width: 1060px) { .edge-arrow { display: none !important; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ═══════════════════════════════════════════════════════════════
//  § 1  CONFIG + THEME  (same palette as the exponent page)
// ═══════════════════════════════════════════════════════════════
const CFG = {
  BASE_MIN: 2, BASE_MAX: 10,
  N_MAX: { 1: 60, 2: 10, 3: 5 },     // per arrow count
  EXACT_DIGITS: 20000,               // compute exactly (BigInt) up to this many digits
  TOWER_SHOW: 9,                     // levels drawn before the tower trails off
  SL_MAX: 12,                        // right edge of the super-log ruler
  RULER_W: 2000,                     // px width; the ruler scrolls sideways
  BASE_HUES: [0, 0, 213, 159, 265, 25, 340, 50, 185, 300],
  EXP_MAX_DIGITS: 15, EXP_CAP: 40,   // mirrors index.html, for deep links
};
const FONT = "'DM Mono', monospace";
const DISP = "'DM Serif Display', serif";
const expMax = b => Math.min(CFG.EXP_CAP, Math.floor(CFG.EXP_MAX_DIGITS / Math.log10(b) + 1e-9));

function makeTheme(base) {
  const hue = CFG.BASE_HUES[base] ?? (base * 37) % 360;
  const H = (s, l, a = 1) => `hsla(${hue},${s}%,${l}%,${a})`;
  return {
    accent: H(75, 62), bg: H(40, 5), cell: H(65, 48), outline: H(80, 72),
    a: (s, l, a) => H(s, l, a),
  };
}

// ═══════════════════════════════════════════════════════════════
//  § 2  HUGE-NUMBER ARITHMETIC
//
//  A number is stored as {h, v}:  value = 10^10^…^10^v  with h tens.
//  h = 0 is an ordinary double.  Normalised so that for h ≥ 1 the top v
//  lies in [15, 10¹⁵): big enough that one more "10^" is meaningful, small
//  enough to print.  Powers a^N only ever need log10, and once h ≥ 2 the
//  ·log10(a) correction is far below double precision, so a↑↑n settles
//  into "add one more 10^ per level" — which is exactly what towers do.
// ═══════════════════════════════════════════════════════════════
const LIM = 1e15, LLIM = 15;
function norm({ h, v }) {
  while (h > 0 && v < LLIM) { v = Math.pow(10, v); h--; }
  while (v >= LIM) { v = Math.log10(v); h++; }
  return { h, v };
}
function powRep(a, N) {                         // a^N
  const c = Math.log10(a);
  if (N.h === 0) return norm({ h: 1, v: N.v * c });
  if (N.h === 1) return norm({ h: 2, v: N.v + Math.log10(c) });
  return { h: N.h + 1, v: N.v };
}
function tetRep(a, n) {                         // a↑↑n, n may be ~10¹⁵
  let r = { h: 0, v: a };
  for (let i = 1; i < n; i++) {
    if (r.h >= 2) return { h: r.h + (n - i), v: r.v };   // each level adds one 10^
    r = powRep(a, r);
  }
  return r;
}
// BigInt power by squaring (Babel rewrites ** to Math.pow, which rejects BigInt).
function bigPow(b, e) {
  let r = 1n;
  while (e > 0n) { if (e & 1n) r *= b; b *= b; e >>= 1n; }
  return r;
}
// Exact BigInt a↑↑k (or a^n) while the result stays printable.
function tetExact(a, n) {
  let x = BigInt(a);
  for (let i = 1; i < n; i++) {
    if (Number(x) * Math.log10(a) > CFG.EXACT_DIGITS) return null;
    x = bigPow(BigInt(a), x);
  }
  return x;
}
function powExact(a, n) { return n * Math.log10(a) > CFG.EXACT_DIGITS ? null : bigPow(BigInt(a), BigInt(n)); }

// Super-logarithm: how many times you take log10 before the number is
// below 10.  Each whole unit is one more "10^" in the tower.
const slPlain = x => x < 10 ? Math.log10(Math.max(1, x)) : 1 + slPlain(Math.log10(x));
const slRep   = r => r.beyond ? Infinity : r.h + slPlain(r.v);

// Evaluate a ↑^arrows n, returning every intermediate level.
function evaluate(a, arrows, n) {
  const steps = [];
  if (arrows === 1) {
    for (let k = 1; k <= n; k++) {
      const exact = powExact(a, k);
      steps.push({ k, exact, rep: exact != null && k * Math.log10(a) < 15 ? { h: 0, v: Number(exact) } : powRep(a, { h: 0, v: k }) });
    }
  } else if (arrows === 2) {
    for (let k = 1; k <= n; k++) {
      const exact = tetExact(a, k);
      steps.push({ k, exact, rep: tetRep(a, k) });
    }
  } else {
    // a↑↑↑1 = a,  a↑↑↑k = a↑↑(a↑↑↑(k−1))
    let prev = null;
    for (let k = 1; k <= n; k++) {
      let s;
      if (k === 1) s = { k, exact: BigInt(a), rep: { h: 0, v: a }, height: null };
      else if (prev.rep.beyond || prev.rep.h > 0) s = { k, exact: null, rep: { beyond: true }, height: prev.rep };
      else {
        const height = prev.exact != null ? Number(prev.exact) : Math.round(prev.rep.v);
        s = { k, exact: height <= 6 ? tetExact(a, height) : null, rep: tetRep(a, height), height: { h: 0, v: height } };
      }
      steps.push(s); prev = s;
    }
  }
  return steps;
}

// ═══════════════════════════════════════════════════════════════
//  § 3  FORMATTING
// ═══════════════════════════════════════════════════════════════
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const sup = n => String(n).split("").map(d => SUP[d]).join("");
const fmt = v => v.toLocaleString("en-US");
const ARW = n => "↑".repeat(n);
function fmtReal(v) {
  if (v < 1e4)  return (+v.toFixed(2)).toLocaleString("en-US", { maximumFractionDigits: 2 });
  if (v < 1e15) return v.toLocaleString("en-US", { maximumFractionDigits: 1 });
  const e = Math.floor(Math.log10(v));
  return `${(v / Math.pow(10, e)).toFixed(2)}×10${sup(e)}`;
}
function fmtExact(x) {
  const s = x.toString();
  if (s.length <= 24) return fmt(x);
  return `${s.slice(0, 10)}…${s.slice(-10)}`;
}
const NAMED = [[1e15, "quadrillion"], [1e12, "trillion"], [1e9, "billion"], [1e6, "million"]];
function approxWords(v) {
  for (const [t, nm] of NAMED) if (v >= t) return `${+(v / t).toPrecision(3)} ${nm}`;
  return fmt(Math.round(v));
}

// 10^10^…^v as nested superscripts (h ≤ 4), else the ⋰ form.
function Rep({ r, exact, big }) {
  if (r.beyond) return <span>beyond 10↑↑(10↑↑…)</span>;
  if (exact != null) return <span>{fmtExact(exact)}</span>;
  if (r.h === 0) return <span>{fmtReal(r.v)}</span>;
  if (r.h <= 4) {
    let inner = <span>{fmtReal(r.v)}</span>;
    for (let i = 0; i < r.h; i++) inner = <span>10<sup className="p">{inner}</sup></span>;
    return inner;
  }
  return (
    <span>10<sup className="p">10<sup className="p">⋰<sup className="p">{fmtReal(r.v)}</sup></sup></sup>
      <span style={{ fontSize: big ? "0.45em" : "0.85em", color: "#64748b", marginLeft: 8 }}>({fmt(r.h)} tens)</span>
    </span>
  );
}
function digitsOf(s) {
  if (s.exact != null) return s.exact.toString().length;
  const r = s.rep;
  if (r.beyond) return null;
  if (r.h === 0) return Math.floor(Math.log10(r.v)) + 1;
  if (r.h === 1) return Math.floor(r.v) + 1;
  return null;
}
function readingTime(sec) {
  const yr = sec / 3.156e7, age = 1.38e10;
  if (sec < 3600)  return `${Math.round(sec / 60)} minutes`;
  if (sec < 86400 * 2) return `${Math.round(sec / 3600)} hours`;
  if (yr < 1)      return `${Math.round(sec / 86400)} days`;
  if (yr < age)    return `${approxWords(yr)} years`;
  return `${approxWords(yr / age)} times the age of the universe`;
}

// ═══════════════════════════════════════════════════════════════
//  § 4  LANDMARKS on the super-log ruler
// ═══════════════════════════════════════════════════════════════
const LANDMARKS = [
  { name: "10",              r: { h: 0, v: 10 } },
  { name: "thousand",        r: { h: 0, v: 1e3 } },
  { name: "million",         r: { h: 0, v: 1e6 } },
  { name: "trillion",        r: { h: 0, v: 1e12 } },
  { name: "atoms ≈10⁸⁰",     r: { h: 1, v: 80 } },
  { name: "googol",          r: { h: 1, v: 100 } },
  { name: "googolplex",      r: { h: 2, v: 100 } },
  { name: "googolplexian",   r: { h: 3, v: 100 } },
  { name: "Skewes' number",  r: { h: 3, v: 34 } },
  { name: "BB(5)",           r: { h: 0, v: 47176870 } },
  { name: "10↑↑5",           r: norm({ h: 4, v: 10 }) },
  { name: "10↑↑6",           r: norm({ h: 5, v: 10 }) },
  { name: "10↑↑7",           r: norm({ h: 6, v: 10 }) },
  { name: "10↑↑8",           r: norm({ h: 7, v: 10 }) },
].map(l => ({ ...l, sl: slRep(l.r) }));

function compare(rep) {
  const s = slRep(rep);
  const below = LANDMARKS.filter(l => l.sl <= s + 1e-9 && l.sl > 2);
  if (!below.length) return null;
  const l = below[below.length - 1];
  return Math.abs(l.sl - s) < 1e-9 ? `exactly as big as ${l.name}` : `bigger than ${l.name}`;
}

// ═══════════════════════════════════════════════════════════════
//  § 5  TOWER  — the new base slides in underneath, and the whole
//  previous tower shrinks up into its exponent.
// ═══════════════════════════════════════════════════════════════
function Tower({ a, levels, more, theme, height }) {
  const R = 0.6, F = Math.min(110, height * 0.42), cw = 0.62;
  const glyph = String(a);
  const shown = Math.min(levels, CFG.TOWER_SHOW);
  // depth d = 0 is the bottom (newest) level
  const pos = [];
  let x = 0, y = 0;
  for (let d = 0; d < shown; d++) {
    const sc = Math.pow(R, d);
    pos.push({ x, y, sc });
    x += glyph.length * cw * F * sc + F * sc * 0.06;
    y += F * sc * 0.52;
  }
  // centre the tower's bounding box: it spans from the base glyph's bottom
  // (y = 0) up to the top of the highest glyph
  const top = Math.max(...pos.map(p => p.y + F * p.sc));
  const totalW = x + (more ? F * Math.pow(R, shown) * 3 : 0);
  const ox = -totalW / 2, oy = top / 2;
  return (
    <div style={{ position: "relative", height, width: "100%" }}>
      <div style={{ position: "absolute", left: "50%", top: "50%", transform: `translate(${ox}px, ${oy}px)`, transition: "transform 0.9s cubic-bezier(0.4,0,0.2,1)" }}>
        {pos.map((p, d) => {
          const key = levels - 1 - d;     // counted from the top: stable as the tower grows
          const hot = d === 0;
          return (
            <div key={key} className="lvl" style={{
              transform: `translate(${p.x}px, ${-p.y}px) scale(${p.sc})`,
              fontFamily: DISP, fontSize: F, lineHeight: 1,
              color: hot ? theme.accent : theme.outline,
              textShadow: hot ? `0 0 26px ${theme.a(75, 62, 0.55)}` : "none",
            }}><span>{glyph}</span></div>
          );
        })}
        {more && (
          <div style={{
            position: "absolute", left: x, bottom: y, fontFamily: FONT, fontSize: 12, color: theme.outline,
            whiteSpace: "nowrap", transform: "translate(4px, 4px)",
          }}>⋰ {more}</div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 6  SUPER-LOG RULER
// ═══════════════════════════════════════════════════════════════
function Ruler({ steps, theme }) {
  const W = CFG.RULER_W, X = sl => 40 + (Math.min(sl, CFG.SL_MAX) / CFG.SL_MAX) * (W - 80);
  const rows = [0, 1, 2];
  const cur = steps[steps.length - 1], curSl = slRep(cur.rep);
  return (
    <svg width={W} height={150} style={{ display: "block" }}>
      <line x1={40} x2={W - 40} y1={70} y2={70} stroke="#1e2d3d" strokeWidth={2} />
      {Array.from({ length: Math.floor(CFG.SL_MAX) + 1 }, (_, t) => (
        <g key={t}>
          <line x1={X(t)} x2={X(t)} y1={62} y2={78} stroke="#33475e" strokeWidth={1.5} />
          <text x={X(t)} y={92} textAnchor="middle" fill="#4b5d73" fontSize={11} fontFamily={FONT}>
            {t === 0 ? "1" : t === 1 ? "10" : t === 2 ? "10¹⁰" : `10↑↑${t}`}
          </text>
        </g>
      ))}
      {LANDMARKS.map((l, i) => {
        const row = rows[i % 3], y = 46 - row * 15;
        return (
          <g key={l.name}>
            <line x1={X(l.sl)} x2={X(l.sl)} y1={y + 3} y2={68} stroke="#26364a" strokeWidth={1} />
            <text x={X(l.sl)} y={y} textAnchor="middle" fill="#64748b" fontSize={10} fontFamily={FONT}>{l.name}</text>
          </g>
        );
      })}
      {steps.map((s, i) => {
        const sl = slRep(s.rep);
        if (!isFinite(sl)) return null;
        const last = i === steps.length - 1;
        return (
          <circle key={i} cx={X(sl)} cy={70} r={last ? 0 : 3.5} fill={theme.outline} opacity={0.55}
                  style={{ transition: "cx 1.2s cubic-bezier(0.4,0,0.2,1) 0.5s" }} />
        );
      })}
      {/* current value marker */}
      <g style={{ transform: `translateX(${X(isFinite(curSl) ? curSl : CFG.SL_MAX)}px)`, transition: "transform 1.2s cubic-bezier(0.4,0,0.2,1) 0.5s" }}>
        <line x1={0} x2={0} y1={58} y2={104} stroke={theme.accent} strokeWidth={2} />
        <circle cx={0} cy={70} r={6} fill={theme.accent} />
        <text x={0} y={120} textAnchor={curSl > CFG.SL_MAX ? "end" : "middle"} fill={theme.outline} fontSize={12} fontFamily={FONT}>
          {curSl > CFG.SL_MAX ? "→ off the ruler" : "you are here"}
        </text>
      </g>
      <text x={30} y={142} fill="#33475e" fontSize={10} fontFamily={FONT}>
        super-log scale · every tick is one more “10 to the power of” · scroll sideways →¹
      </text>
    </svg>
  );
}

// Numbers that grow faster than any tower in the ruler: they sit past its right edge.
const BEYOND = ["Graham's number", "TREE(3)", "SSCG(3)", "Rayo's number"];
function RulerFooter() {
  return (
    <div style={{ marginTop: 10, fontFamily: FONT, fontSize: 10, color: "#4b5d73", lineHeight: 1.6 }}>
      <span style={{ color: "#64748b" }}>Beyond the right edge →</span> {BEYOND.join(" · ")}
      <div style={{ marginTop: 6, color: "#334155" }}>
        ¹ Extremes follow the Googology Wiki’s “List of numbers”, <a href="https://googology.miraheze.org/wiki/List_of_numbers" target="_blank" rel="noopener" style={{ color: "#64748b" }}>googology.miraheze.org/wiki/List_of_numbers</a>.
        Exact values for the beyond group are not representable on this ruler.
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  SERIES NAV — every page in the big-numbers series, in order.
//  Shown as a stepper at the top, ‹ › arrows on the screen edges
//  (wide screens), and a "next" card at the bottom of the page.
// ═══════════════════════════════════════════════════════════════
const SERIES = [
  { href: "index.html",   label: "Exponents",   tag: "bⁿ" },
  { href: "uparrow.html", label: "Up-arrows",   tag: "a↑↑n" },
  { href: "numberline.html", label: "Number line", tag: "you are here" },
];

const PAGES = [
  { href: "index.html", label: "Exponents" },
  { href: "uparrow.html", label: "Up-arrows" },
  { href: "numberline.html", label: "Number line" },
];
function PageSwitch({ current, color, line }) {
  return (
    <nav style={{ display: "inline-flex", border: `1px solid ${line}`, borderRadius: 8, overflow: "hidden", fontFamily: FONT, fontSize: 11, flexShrink: 0 }}>
      {PAGES.map((p, i) => (
        <a key={p.href} href={p.href} style={{
          padding: "5px 10px", textDecoration: "none", whiteSpace: "nowrap",
          background: i === current ? color : "transparent",
          color: i === current ? "#0a1020" : "#94a3b8", fontWeight: i === current ? 600 : 400,
        }}>{p.label}</a>
      ))}
    </nav>
  );
}

function EdgeArrows({ current, color }) {
  const arrow = (p, side) => {
    if (!p) return null;
    const st = {
      position: "fixed", top: "50%", [side]: 14, transform: "translateY(-50%)", zIndex: 30,
      display: "flex", flexDirection: "column", alignItems: "center", gap: 6, textDecoration: "none",
      fontFamily: FONT, fontSize: 10, color: p.href ? color : "#4b5d73", opacity: p.href ? 1 : 0.6,
    };
    const circle = (
      <span style={{
        width: 46, height: 46, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 22, border: `2px solid ${p.href ? color : "#1e2d3d"}`, background: "rgba(10,16,32,.85)",
      }}>{side === "left" ? "‹" : "›"}</span>
    );
    const text = <span style={{ textAlign: "center", lineHeight: 1.3 }}>{p.label}<br /><span style={{ opacity: 0.6 }}>{p.tag}</span></span>;
    return p.href
      ? <a key={side} href={p.href} className="edge-arrow" style={st}>{circle}{text}</a>
      : <span key={side} className="edge-arrow" style={st}>{circle}{text}</span>;
  };
  return <>{arrow(SERIES[current - 1], "left")}{arrow(SERIES[current + 1], "right")}</>;
}


// ═══════════════════════════════════════════════════════════════
//  § 7  APP
// ═══════════════════════════════════════════════════════════════
function NavBtn({ label, onClick, disabled, theme }) {
  return (
    <button onClick={onClick} disabled={disabled} className="nav-btn" style={{
      width: 44, height: 44, borderRadius: "50%", flexShrink: 0,
      background: disabled ? "#0d1625" : theme.cell, border: `2px solid ${disabled ? "#1e2a3a" : theme.outline}`,
      color: disabled ? "#2a3a4e" : "#fff", fontSize: 22, cursor: disabled ? "not-allowed" : "pointer",
      display: "flex", alignItems: "center", justifyContent: "center", opacity: disabled ? 0.35 : 1,
      boxShadow: disabled ? "none" : `0 0 16px ${theme.a(75, 62, 0.3)}`, transition: "all 0.15s",
    }}>{label}</button>
  );
}

function readParams() {
  const q = new URLSearchParams(location.search);
  let a = parseInt(q.get("base"), 10), ar = parseInt(q.get("arrows"), 10), n = parseInt(q.get("n"), 10);
  if (!(a >= CFG.BASE_MIN && a <= CFG.BASE_MAX)) a = 3;
  if (!(ar >= 1 && ar <= 3)) ar = 2;
  if (!(n >= 1)) n = 3;
  return { a, ar, n: Math.min(n, CFG.N_MAX[ar]) };
}

const ARROW_INFO = {
  1: { name: "power",      def: (a) => `a↑n = a × a × … × a  (n copies of ${a})` },
  2: { name: "tetration",  def: (a) => `a↑↑n = a↑(a↑(…↑a))  — a tower of n ${a}s, evaluated from the top` },
  3: { name: "pentation",  def: (a) => `a↑↑↑n = a↑↑(a↑↑(…↑↑a))  — each step's answer becomes the next tower's height` },
};

function App() {
  const [init] = useState(readParams);
  const [a, setA]   = useState(init.a);
  const [ar, setAr] = useState(init.ar);
  const [n, setN]   = useState(init.n);
  const theme = makeTheme(a);
  const steps = evaluate(a, ar, n);
  const cur   = steps[steps.length - 1];
  const nMax  = CFG.N_MAX[ar];

  useEffect(() => {
    try { history.replaceState(null, "", `?base=${a}&arrows=${ar}&n=${n}`); } catch (_) { /* file:// */ }
  }, [a, ar, n]);
  useEffect(() => {
    const onKey = e => {
      if (["ArrowRight", "ArrowUp", "+", "="].includes(e.key)) setN(v => Math.min(CFG.N_MAX[ar], v + 1));
      if (["ArrowLeft", "ArrowDown", "-"].includes(e.key)) setN(v => Math.max(1, v - 1));
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [ar]);

  const changeAr = v => { setAr(v); setN(x => Math.min(x, CFG.N_MAX[v])); };

  // Tower picture: ↑↑ draws n levels; ↑↑↑ draws the tower its last step builds.
  let levels = n, more = null;
  if (ar === 1) levels = 0;
  if (ar === 3) {
    const h = cur.height;
    if (n === 1) levels = 1;
    else if (h && h.h === 0) { levels = h.v; if (h.v > CFG.TOWER_SHOW) more = `${approxWords(h.v)} levels`; }
    else { levels = CFG.TOWER_SHOW; more = "a tower too tall to count"; }
  } else if (ar === 2 && n > CFG.TOWER_SHOW) more = `${n} levels`;

  // Deep link: a tower whose exponent fits on the exponent page.
  const linkExp = (() => {
    if (ar === 1) return n <= expMax(a) ? n : null;
    if (ar === 2 && n >= 2) { const e = steps[n - 2].exact; return e != null && e <= BigInt(expMax(a)) ? Number(e) : null; }
    return null;
  })();

  const D = digitsOf(cur);
  const facts = [];
  if (cur.rep.beyond) {
    facts.push("The height of this tower is itself a tower too tall to write down — no computer can hold it.");
    facts.push("Graham's number goes further still: it repeats this kind of jump 64 times, adding arrows each time.");
  } else {
    if (D != null) facts.push(`${fmt(D)} digit${D === 1 ? "" : "s"} long.`);
    if (D != null && D > 3600) facts.push(`Reading it aloud at one digit per second would take ${readingTime(D)}.`);
    if (cur.rep.h === 2) facts.push(`Even its number of digits has about ${approxWords(Math.floor(cur.rep.v) + 1)} digits.`);
    if (cur.rep.h >= 3) facts.push(`Writing down how many digits it has — or even how many digits that has — is hopeless: it is a tower of ${fmt(cur.rep.h)} tens.`);
    const c = compare(cur.rep);
    if (c) facts.push(`It is ${c}.`);
  }

  const tabStyle = on => ({
    fontFamily: FONT, fontSize: 11, fontWeight: 500, whiteSpace: "nowrap", padding: "4px 9px", borderRadius: 7, height: 28,
    background: on ? theme.cell : "transparent", color: on ? "#fff" : "#64748b",
  });

  return (
    <div style={{ minHeight: "100vh", background: "#0a1020", color: "#e2e8f0", fontFamily: FONT,
                  display: "flex", flexDirection: "column", alignItems: "center", padding: "16px 16px 32px" }}>
      {/* Header */}
      <div style={{ width: "min(880px,100%)", display: "flex", alignItems: "center", marginBottom: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: DISP, fontSize: "clamp(20px,3.6vw,28px)", color: theme.outline, textShadow: `0 0 20px ${theme.a(75, 62, 0.3)}` }}>
            Up-Arrow Towers
          </div>
          <div style={{ fontSize: 9, color: "#4b5d73", marginTop: 2, letterSpacing: "0.09em", textTransform: "uppercase" }}>
            Knuth's up-arrow notation · when exponents aren't big enough
          </div>
        </div>
        <PageSwitch current={1} color={theme.outline} line={theme.a(75, 62, 0.35)} />
      </div>

      <EdgeArrows current={1} color={theme.outline} />

      {/* Controls */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", marginBottom: 10 }}>
        <div style={{ maxWidth: "100%", overflowX: "auto", display: "flex", gap: 3, background: "#131e2e", padding: 4, borderRadius: 10 }}>
          {Array.from({ length: CFG.BASE_MAX - CFG.BASE_MIN + 1 }, (_, i) => i + CFG.BASE_MIN).map(b => (
            <button key={b} className="bt" onClick={() => setA(b)} style={{ ...tabStyle(a === b), background: a === b ? makeTheme(b).cell : "transparent" }}>{b}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 3, background: "#131e2e", padding: 4, borderRadius: 10 }}>
          {[1, 2, 3].map(v => (
            <button key={v} className="bt" onClick={() => changeAr(v)} style={tabStyle(ar === v)}>{ARW(v)} {ARROW_INFO[v].name}</button>
          ))}
        </div>
      </div>

      {/* Stage */}
      <div style={{
        width: "min(880px,100%)", background: theme.bg, borderRadius: 18, position: "relative", overflow: "hidden",
        border: `1.5px solid ${theme.a(75, 62, 0.12)}`, boxShadow: `inset 0 0 24px #00000066`, padding: "14px 16px 10px",
      }}>
        <div style={{ textAlign: "center", fontFamily: DISP, fontSize: "clamp(28px,5vw,44px)", color: "#f8fafc" }}>
          <span style={{ color: theme.accent }}>{a}</span>
          <span style={{ color: theme.outline, margin: "0 4px" }}>{ARW(ar)}</span>
          <span>{n}</span>
        </div>
        <div style={{ textAlign: "center", fontSize: 11, color: "#64748b", marginTop: 2 }}>{ARROW_INFO[ar].def(a)}</div>

        {ar === 1 ? (
          <div style={{ minHeight: 230, display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: 6, padding: 16 }}>
            {Array.from({ length: Math.min(n, 24) }, (_, i) => (
              <span key={i} className="row" style={{ fontFamily: DISP, fontSize: 30, color: i === n - 1 ? theme.accent : theme.outline, animationDelay: `${i * 30}ms` }}>
                {a}{i < Math.min(n, 24) - 1 && <span style={{ color: "#33475e", margin: "0 0 0 6px", fontSize: 20 }}>×</span>}
              </span>
            ))}
            {n > 24 && <span style={{ color: "#64748b", fontSize: 13 }}>× … ({n} copies)</span>}
          </div>
        ) : (
          <Tower a={a} levels={levels} more={more} theme={theme} height={260} />
        )}

        <div style={{ textAlign: "center", fontFamily: DISP, fontSize: "clamp(18px,3vw,26px)", color: "#f1f5f9", minHeight: 40, overflowWrap: "anywhere" }}>
          <span style={{ color: "#4b5d73", fontSize: "0.7em", marginRight: 8 }}>=</span>
          <Rep r={cur.rep} exact={cur.exact} big />
        </div>
        {cur.rep.beyond && cur.height && (
          <div style={{ textAlign: "center", fontSize: 11, color: "#64748b" }}>a tower of {a}s whose height is <Rep r={cur.height} /></div>
        )}
      </div>

      {/* Step control */}
      <div style={{ display: "flex", alignItems: "center", gap: 16, margin: "14px 0" }}>
        <NavBtn label="−" onClick={() => setN(Math.max(1, n - 1))} disabled={n === 1} theme={theme} />
        <div style={{ textAlign: "center", minWidth: 120 }}>
          <div style={{ fontSize: 10, color: "#4b5d73", letterSpacing: "0.08em", textTransform: "uppercase" }}>n</div>
          <div style={{ fontSize: 22, color: theme.outline }}>{n}</div>
        </div>
        <NavBtn label="+" onClick={() => setN(Math.min(nMax, n + 1))} disabled={n === nMax} theme={theme} />
      </div>

      {/* Ruler */}
      <div style={{ width: "min(880px,100%)", background: "#0e1828", borderRadius: 12, padding: "8px 10px", border: `1px solid ${theme.a(75, 62, 0.15)}`, marginBottom: 12 }}>
        <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
          <Ruler steps={steps} theme={theme} />
        </div>
        <RulerFooter />
      </div>

      {/* Steps + facts */}
      <div style={{ width: "min(880px,100%)", display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))", gap: 12 }}>
        <div style={{ background: "#0e1828", borderRadius: 12, padding: "12px 14px", border: `1px solid ${theme.a(75, 62, 0.15)}` }}>
          <div style={{ fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#4b5d73", marginBottom: 8 }}>
            {ar === 2 ? "built from the top down" : ar === 3 ? "each answer becomes the next height" : "step by step"}
          </div>
          {steps.slice(-12).map((s, i, arr) => {
            const last = i === arr.length - 1;
            const lhs = ar === 3 && s.k > 1 && s.height
              ? <>{a}{ARW(3)}{s.k} = {a}↑↑<Rep r={s.height} /></>
              : <>{a}{ARW(ar)}{s.k}</>;
            return (
              <div key={`${a}-${ar}-${s.k}`} className={`row${last ? " fresh" : ""}`} style={{
                "--glow": theme.a(75, 62, 0.25), display: "flex", gap: 10, padding: "5px 6px", borderRadius: 6,
                fontSize: 12, color: last ? "#f1f5f9" : "#94a3b8", animationDelay: last ? "0.5s" : "0s",
              }}>
                <span style={{ color: theme.outline, whiteSpace: "nowrap" }}>{lhs}</span>
                <span style={{ color: "#33475e" }}>=</span>
                <span style={{ overflowWrap: "anywhere" }}><Rep r={s.rep} exact={s.exact} /></span>
              </div>
            );
          })}
          {linkExp != null && linkExp > 0 && (
            <a href={`index.html?base=${a}&exp=${linkExp}`} className="tool" style={{ marginTop: 8, color: theme.outline, border: `1px solid ${theme.a(75, 62, 0.3)}` }}>
              ▦ see {a}{sup(linkExp)} as a field of cells →
            </a>
          )}
        </div>
        <div style={{ background: "#0e1828", borderRadius: 12, padding: "12px 14px", border: `1px solid ${theme.a(75, 62, 0.15)}` }}>
          <div style={{ fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#4b5d73", marginBottom: 8 }}>how big is that?</div>
          {facts.map((f, i) => (
            <div key={`${a}-${ar}-${n}-${i}`} className="row" style={{ fontSize: 12, color: "#a5b4c8", lineHeight: 1.6, marginBottom: 6, animationDelay: `${0.7 + i * 0.12}s` }}>{f}</div>
          ))}
          <div style={{ fontSize: 11, color: "#4b5d73", lineHeight: 1.6, marginTop: 10 }}>
            One arrow repeats multiplication. Two arrows repeat powers: the new {a} goes underneath and the
            whole old tower becomes its exponent. Three arrows repeat towers.
          </div>
        </div>
      </div>

      <div style={{ fontSize: 9, color: "#334155", letterSpacing: "0.08em", marginTop: 14 }}>← → or ± to change n</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
