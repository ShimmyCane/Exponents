<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Number Line</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #0a1020; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    .btn { cursor: pointer; border: 1px solid #1e2d3d; background: #0e1828; color: #94a3b8; border-radius: 8px;
           font-size: 11px; padding: 6px 10px; transition: filter .15s, background .15s; }
    .btn:hover:not(:disabled) { filter: brightness(1.35); }
    .btn:disabled { opacity: .35; cursor: default; }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .flip { animation: flip .4s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes flip { from { opacity: 0; transform: perspective(700px) rotateX(-10deg) translateY(6px); } to { opacity: 1; transform: none; } }
    .next { display: flex; align-items: center; gap: 14px; text-decoration: none; border-radius: 12px; padding: 12px 16px;
            transition: filter .15s, transform .15s; }
    .next:hover { filter: brightness(1.2); transform: translateX(2px); }
    .edge-arrow:hover { filter: brightness(1.35); }
    @media (max-width: 1060px) { .edge-arrow { display: none !important; } }
    sup { line-height: 0; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const FONT = "'DM Mono', monospace";
const DISP = "'DM Serif Display', serif";
const HUE = 213;
const T = {
  accent: `hsl(${HUE},75%,62%)`, outline: `hsl(${HUE},80%,72%)`, cell: `hsl(${HUE},65%,48%)`,
  a: (l, a) => `hsla(${HUE},75%,${l}%,${a})`,
};

// ═══════════════════════════════════════════════════════════════
//  § 1  THE JOURNEY
//
//  One ordered list, taken from the Googology Wiki's "List of numbers"
//  (names, values and order as the wiki gives them).  Each entry:
//    n name · v value · a approximation · t note · j how it differs from
//    the previous entry · l link to another page · x "ill-defined" flag
//  Values are written as text; ^{…} makes a superscript, nested as deep as
//  needed, so towers of exponents read as towers.
// ═══════════════════════════════════════════════════════════════
const CH = [
  { name: "Counting",           short: "Counting", blurb: "Numbers you can count to. Each step is a few times bigger than the last." },
  { name: "Names",              short: "Names",    blurb: "Every ×1,000 earns a new name. This is where numbers meet the real world: seconds, stars, atoms." },
  { name: "Powers of powers",   short: "Powers",   blurb: "The exponent itself becomes enormous. You can describe these, but never write them out." },
  { name: "Towers",             short: "Towers",   blurb: "Exponents of exponents: every step adds one more “10 to the power of”." },
  { name: "Up-arrows",          short: "Arrows",   blurb: "Towers of towers. Each extra arrow repeats the operation before it." },
  { name: "Graham and beyond",  short: "Graham",   blurb: "Numbers made for a purpose, from polygon notation to proofs in mathematics." },
  { name: "Past all notation",  short: "Beyond",   blurb: "Defined by fast-growing functions, programs and logic, not by writing anything down." },
];
const E = (c, n, v, j, t, x = {}) => ({ c, n, v, j, t, ...x });

const ENTRIES = [
  // 0 · Counting
  E(0, "One", "1", "", "Where every number starts. Everything on this page is made from it by adding, multiplying or raising to powers.", { s: "One person, one breath, one step." }),
  E(0, "Ten", "10", "×10", "The base of our number system: ten fingers, ten digits.", { s: "Ten fingers on two hands." }),
  E(0, "Hundred", "100", "×10", "Ten tens, or 10^{2}. You can still hold this in your head.", { s: "A century is a hundred years.", l: ["index.html?base=10&exp=2", "see 10² as a field of cells"] }),
  E(0, "Thousand", "1,000", "×10", "The wiki also lists it as Killion. From here, the short scale gives a new name to every ×1,000.", { s: "A thousand steps is about a ten-minute walk.", l: ["index.html?base=10&exp=3", "see 10³ as a field of cells"] }),
  E(0, "Myriad", "10,000", "×10", "The Greek word for ten thousand. East Asian languages still count in units of it.", { s: "The popular 10,000-steps-a-day goal is about 8 kilometres of walking." }),
  E(0, "Lakh", "100,000", "×10", "The Indian numbering system has a word for this. Ten million is a crore.", { s: "A person has roughly 100,000 hairs on their head." }),
  E(0, "Million", "1,000,000", "×10", "A thousand thousands. The wiki’s second class starts here.", { s: "A million seconds is about 11.6 days.", l: ["index.html?base=10&exp=6", "see 10⁶ as a field of cells"] }),
  E(0, "Crore", "10,000,000", "×10", "Ten million, in the Indian system. The wiki also calls it Pipsqueak.", { s: "Ten million seconds is about 116 days, nearly four months." }),
  E(0, "Hundred million", "100,000,000", "×10", "The wiki calls it Myllion. Nine digits are still all you need.", { s: "A hundred million seconds is about 3.2 years." }),
  // 1 · Names: the short scale, one name per ×1,000
  E(1, "Billion", "10^{9}", "×10", "In the short scale, which most English speakers use. The older long scale used billion for 10¹².", { a: "1,000,000,000", s: "A billion seconds is about 31.7 years. The Earth has about 8 billion people.", l: ["index.html?base=10&exp=9", "see 10⁹ as a field of cells"] }),

  E(1, "Quadrillion", "10^{15}", "×1,000", "A thousand trillions.", { s: "A quadrillion seconds is about 31.7 million years. Ants on Earth are estimated at around 20 quadrillion.", l: ["index.html?base=10&exp=15", "see 10¹⁵ as a field of cells"] }),
  E(1, "Quintillion", "10^{18}", "×1,000", "A quintillion seconds is about 31.7 billion years: more than twice the age of the universe.", { s: "The Milky Way is about a quintillion kilometres across, roughly 100,000 light-years." }),
  E(1, "Sextillion", "10^{21}", "×1,000", "The names are Latin: sex- means six, and each -illion is another thousand.", { s: "The Earth weighs about 6 sextillion tonnes." }),
  E(1, "Avogadro’s number", "6.022 × 10^{23}", "about ×600", "How many particles make a mole: the atoms in 12 grams of carbon-12. A number chemists really use.", { s: "A teaspoon of water holds roughly 2 × 10²³ molecules." }),
  E(1, "Septillion", "10^{24}", "about ×1.7", "A thousand sextillions.", { s: "Estimates of the stars in the observable universe run from about 10²² up to 10²⁴: as many as a septillion." }),
  E(1, "Octillion", "10^{27}", "×1,000", "A thousand septillions.", { s: "A 70-kilogram adult is made of about 7 × 10²⁷ atoms, around seven octillion." }),
  E(1, "Nonillion", "10^{30}", "×1,000", "Spelled with an ‘i’: nonillion. Nine, in Latin, plus the same -illion.", { s: "The Sun weighs about 2 nonillion kilograms. Earth’s bacteria and archaea number around 5 nonillion." }),

  E(1, "Vigintillion", "10^{63}", "×1,000", "Twenty, in Latin: the twentieth name in the short scale.", { s: "The observable universe is about 5 × 10⁶¹ Planck lengths across, around a twentieth of a vigintillion." }),
  E(1, "Eddington’s number", "1.57 × 10^{79}", "about ×10¹⁶", "Arthur Eddington’s estimate of the protons in the observable universe: 136 × 2²⁵⁶.", { s: "About as many as the atoms in the whole observable universe." }),
  E(1, "Googol", "10^{100}", "about ×6 × 10²⁰", "A 1 followed by 100 zeros. Coined by nine-year-old Milton Sirotta, nephew of the mathematician Edward Kasner, who popularised it in 1940.", { s: "A googol is 10²⁰ times more than the atoms in the observable universe (about 10⁸⁰)." }),
  E(1, "Planck volumes in the universe", "4.6 × 10^{185}", "about ×4.6 × 10⁸⁵", "Roughly how many Planck volumes, the smallest volume that means anything in physics, fit in the observable universe.", { s: "Fill the whole visible universe with the tiniest cells physics allows and you have only about 10¹⁸⁵ of them: still fewer than a googol squared." }),
  E(1, "Centillion", "10^{303}", "about ×2 × 10¹¹⁷", "The short-scale name for 10³⁰³.", { s: "Even all the Planck volumes in the universe (about 10¹⁸⁵) leave you short by a factor of 10¹¹⁷." }),
  E(1, "Short Infinity", "2^{1,024}", "about ×180,000", "The wiki’s name for the first number a 64-bit floating-point value cannot hold. Computers print anything this big as “Infinity”.", { a: "≈ 1.80 × 10^{308}" }),
  E(1, "Faxul", "200!", "about ×4 × 10⁶⁶", "200 factorial: 1 × 2 × 3 × … × 200. Factorials outgrow any plain exponential.", { a: "≈ 7.9 × 10^{374}" }),
  E(1, "Googolchime", "10^{1,000}", "about ×10⁶²⁵", "A 1 followed by a thousand zeros."),
  E(1, "Millillion", "10^{3,003}", "×10²⁰⁰³", "The short-scale name for 10^(3·1000+3): the thousandth ‘-illion’."),
  // 2 · Powers of powers
  E(2, "Largest known prime", "2^{136,279,841} − 1", "the exponent: 3,003 → 41 million", "A Mersenne prime with about 41 million digits: the largest known prime, according to the wiki as of 2026.", { a: "≈ 8.8 × 10^{41,024,319}", s: "Printed at 3,000 digits a page, it would fill about 13,700 pages." }),
  E(2, "Trialogue", "10^{10^{10}}", "the exponent: 41 million → 10 billion", "10↑↑3, a tower of three tens: a 1 followed by ten billion zeros. The ‘-logue’ names count the tens in a tower.", { s: "Printed at 3,000 digits a page, its ten billion digits would make a stack of paper about 330 metres high: as tall as the Eiffel Tower." }),
  E(2, "Ballium’s number", "2.035 × 10^{138,732,019,349}", "the exponent: 10 billion → 139 billion", "Listed on the wiki with an approximate value only, so it is shown as given."),
  E(2, "3↑↑4", "3^{3^{3^{3}}}", "the exponent: 139 billion → 3.6 trillion", "Tetration: 3^(3^(3^3)) = 3^7,625,597,484,987. The wiki writes it ⁴3.", { a: "≈ 1.26 × 10^{3,638,334,640,024}", l: ["uparrow.html?base=3&arrows=2&n=4", "build it on the Up-arrows page"] }),
  E(2, "Googolplex", "10^{10^{100}}", "the exponent: 3.6 trillion → a googol", "10 to the power of a googol. It has more digits than there are atoms in the observable universe, so it cannot be written out.", { s: "Give every atom in the universe one digit and you would run out at 10⁸⁰: a googolplex needs 10¹⁰⁰ digits." }),
  E(2, "Googolbang", "(10^{100})!", "the exponent: 10¹⁰⁰ → about 10¹⁰²", "A googol factorial: multiply every whole number up to a googol.", { a: "≈ 10^{9.957 × 10^{101}}" }),
  E(2, "Kilofaxul", "(200!)!", "the exponent: 10¹⁰² → 10³⁷⁷", "The factorial of Faxul, which was already 200!.", { a: "≈ 10^{10^{377.5}}" }),
  E(2, "Googolplexichime", "10^{10^{1,000}}", "the exponent: 10³⁷⁷ → 10¹⁰⁰⁰", "A googolplex-style number with a thousand in place of the hundred."),

  E(3, "First Skewes number", "10^{10^{10^{34}}}", "the top exponent: 10 → 34", "In 1933 Skewes bounded where the prime count first overtakes a logarithmic estimate, assuming the Riemann hypothesis. The wiki writes e^e^e^79.", { a: "≈ e^{e^{e^{79}}}" }),
  E(3, "Googolduplex", "10^{10^{10^{100}}}", "the top exponent: 34 → 100", "Googol, googolplex, googolduplex: each name adds one more “10 to the power of”."),

  E(3, "Second Skewes number", "10^{10^{10^{963}}}", "the top exponent: 377 → 963", "Skewes’ later bound (1955), which does not assume the Riemann hypothesis. The wiki writes e^e^e^e^7.705.", { a: "≈ e^{e^{e^{e^{7.705}}}}" }),
  E(3, "Googolduplexichime", "10^{10^{10^{1,000}}}", "the top exponent: 963 → 1,000", "The same tower, with a thousand at the top."),
  E(3, "Pentalogue", "10↑↑5", "one more “10 to the power of”", "Five tens stacked. The wiki’s fifth class begins just below it.", { a: "10^{10^{10^{10^{10}}}}" }),
  E(3, "Poincaré’s number", "10^{10^{10^{10^{13}}}}", "the top exponent: 10 → 13", "Listed on the wiki, under this name, between the Pentalogue and the Googoltriplex. Poincaré recurrence is the idea that a closed system eventually returns near its starting state."),
  E(3, "Googoltriplex", "10^{10^{10^{10^{100}}}}", "the top exponent: 13 → 100", "Googolduplex with one more level."),
  E(3, "Hexalogue", "10↑↑6", "one more “10 to the power of”", "Six tens stacked.", { a: "10^{10^{10^{10^{10^{10}}}}}" }),
  E(3, "Octalogue", "10↑↑8", "two more tower levels", "Eight tens stacked."),
  E(3, "Hexadekalogue", "10↑↑16", "eight more tower levels", "Sixteen tens stacked."),
  E(3, "Mega", "2[5]", "about 240 more levels", "Hugo Steinhaus’s polygon notation: a 2 inside a pentagon.", { a: "≈ 10↑↑258" }),
  E(3, "Megalogue", "10↑↑1,000,000", "a million levels", "A tower of tens a million levels tall. The wiki also calls it Chilia-chilialogue."),
  E(3, "Tritri", "3↑↑↑3", "a tower of 3s, not tens", "Bowers’ {3,3,3}: a tower of 3s about 7.6 trillion levels tall. The same number you reach with three arrows on the Up-arrows page.", { a: "= 3↑↑7,625,597,484,987", l: ["uparrow.html?base=3&arrows=3&n=3", "build it on the Up-arrows page"] }),
  E(3, "Googolgoogolplex", "10↑↑10^{100}", "tower height: 7.6 trillion → a googol", "A tower of tens a googol levels tall. The wiki also calls it Googol-stack."),
  // 4 · Up-arrows
  E(4, "Hexa-taxis", "10↑↑↑6", "the tower’s height becomes a tower", "Three arrows: a tower of tens whose height is 10↑↑↑5, which is itself a tower."),
  E(4, "Megiston", "10[5]", "five more repetitions", "Steinhaus’s notation again: a 10 inside a pentagon.", { a: "≈ 10↑↑↑11" }),
  E(4, "Gaggol", "10↑↑↑100", "about 90 more repetitions", "Three arrows, repeated a hundred times. The wiki writes it {10,100,3}."),
  E(4, "Gaggolchime", "10↑↑↑1,000", "900 more repetitions", "Three arrows, repeated a thousand times."),
  E(4, "Googol-3-flex", "10↑↑↑10^{100}", "a googol repetitions", "Three arrows, repeated a googol times."),
  E(4, "Grahal", "3↑↑↑↑3", "a fourth arrow", "Graham’s number starts here: g₁ = 3↑↑↑↑3. Already far beyond any tower you could write.", { a: "= g₁" }),
  E(4, "Hexar", "6↑↑↑↑6", "bigger numbers, same four arrows", "Four arrows again, with 6s in place of 3s."),
  E(4, "Boogol", "10↑^{100}10", "a hundred arrows", "A hundred arrows between two tens. The wiki writes {10,10,100}."),
  // 5 · Graham and beyond
  E(5, "Moser’s number", "2[2[5]]", "arrows → polygons", "Steinhaus–Moser notation: a 2 in a polygon with Mega sides.", { a: "≈ 3 ↑ Mega 3" }),
  E(5, "Graham’s second number", "3↑^{g₁}3", "g₁ arrows between two 3s", "The second step in Graham’s construction: the number of arrows is the whole of g₁.", { a: "= g₂" }),
  E(5, "Graham’s number", "G₆₄", "62 more steps of the same rule", "Graham and Rothschild used it as an upper bound in a problem in Ramsey theory. It once held the Guinness record for the largest number used in a proof.", { a: "= g₆₄" }),
  E(5, "xkcd number", "A(G, G)", "Ackermann’s function applied to Graham’s number", "The wiki gives it as A(G,G), with G Graham’s number."),
  E(5, "Conway’s Tetratri", "3→3→3→3", "chained arrows", "A chain of four 3s in Conway’s chained-arrow notation. It beats Graham’s number."),
  E(5, "Conway’s Tetratet", "4→4→4→4", "4s instead of 3s", "The same chain with 4s."),
  // 6 · Past all notation
  E(6, "Gongulus", "{10,10 (100) 2}", "a new kind of separator", "Bowers’ array notation (BEAF) with a separator that adds whole dimensions to the array."),
  E(6, "Bird’s number", "f_ϑ(Ω^ω)+2(…(7))", "a fast-growing function, iterated", "Defined with the fast-growing hierarchy by applying one function over and over. The wiki lists it just below TREE(3)."),
  E(6, "TREE(3)", "TREE(3)", "a function from a theorem about trees", "From Kruskal’s tree theorem: the longest possible sequence of labelled trees, each not embedded in an earlier one. The wiki gives only a lower bound.", { a: "lower bound f_ψ₀(Ω_Ω^ω)(3)" }),
  E(6, "SSCG(3)", "SSCG(3)", "a function from a theorem about graphs", "From Friedman’s subcubic graph problem: the longest sequence of subcubic graphs obeying a rule. The wiki gives only a lower bound, and it is far larger than TREE(3)."),
  E(6, "Loader’s number", "D⁵(99)", "a program, not a formula", "The output of a short program by Ralph Loader (2001) that runs every well-formed expression of the calculus of constructions."),
  E(6, "Σ(745)", "Σ(745)", "the busy beaver function", "A busy beaver number. The wiki marks it as the smallest known one that cannot be proved in ZFC."),
  E(6, "Σ(1919)", "Σ(1919)", "a later busy beaver number", "The wiki gives this as an upper bound for the smallest busy beaver number unprovable in ZFC."),
  E(6, "Rayo’s number", "Rayo(10^{100})", "a number defined by logic", "The smallest number bigger than any number that a first-order set-theory formula of a googol symbols can name. The wiki marks its definition as only partly settled.", { x: "partly ill-defined" }),
  E(6, "BIG FOOT", "FOOT(10^{100})", "a bigger notation", "The wiki lists BIG FOOT, Little Bigeddon and Sasquatch as ill-defined: the notations were never made precise enough to be sure they name a number.", { x: "ill-defined" }),
  E(6, "Little Bigeddon", "em(12↑↑12)", "another notation", "Ill-defined, according to the wiki.", { x: "ill-defined" }),
  E(6, "Sasquatch", "em₂(12↑↑12)", "one more level of the same idea", "Ill-defined, according to the wiki.", { x: "ill-defined" }),
  E(6, "Hollom’s number", "Hollom’s number", "the last entry", "The wiki’s last entry, written with the Iota function. It marks it as very ill-defined.", { a: "≈ I(6.895 × 10^{104})(200)", x: "very ill-defined" }),
];
const N = ENTRIES.length;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
ENTRIES.forEach(e => { e.id = slug(e.n); });
const CH_START = CH.map((_, c) => ENTRIES.findIndex(e => e.c === c));
const CH_END = CH.map((_, c) => ENTRIES.map(e => e.c).lastIndexOf(c));

// ═══════════════════════════════════════════════════════════════
//  § 2  TEXT WITH SUPERSCRIPTS
// ═══════════════════════════════════════════════════════════════
function parseVal(s) {
  let i = 0;
  const run = stop => {
    const out = []; let buf = "";
    while (i < s.length && s[i] !== stop) {
      if (s[i] === "^" && s[i + 1] === "{") {
        if (buf) { out.push(buf); buf = ""; }
        i += 2; const inner = run("}"); i++;
        out.push({ sup: inner });
      } else buf += s[i++];
    }
    if (buf) out.push(buf);
    return out;
  };
  return run(null);
}
const renderVal = nodes => nodes.map((n, k) =>
  typeof n === "string" ? <span key={k}>{n}</span>
    : <sup key={k} style={{ fontSize: "0.6em", verticalAlign: "0.55em" }}>{renderVal(n.sup)}</sup>);
const Val = ({ s }) => <>{renderVal(parseVal(s))}</>;

// ═══════════════════════════════════════════════════════════════
//  § 3  PAGE SWITCH + EDGE ARROWS (shared with the other pages)
// ═══════════════════════════════════════════════════════════════
const PAGES = [
  { href: "index.html", label: "Exponents" },
  { href: "uparrow.html", label: "Up-arrows" },
  { href: "numberline.html", label: "Number line" },
];
function PageSwitch({ current }) {
  return (
    <nav style={{ display: "inline-flex", border: `1px solid ${T.a(62, 0.3)}`, borderRadius: 8, overflow: "hidden", fontFamily: FONT, fontSize: 11, flexShrink: 0 }}>
      {PAGES.map((p, i) => (
        <a key={p.href} href={p.href} style={{
          padding: "5px 10px", textDecoration: "none", whiteSpace: "nowrap",
          background: i === current ? T.outline : "transparent",
          color: i === current ? "#0a1020" : "#94a3b8", fontWeight: i === current ? 600 : 400,
        }}>{p.label}</a>
      ))}
    </nav>
  );
}
function EdgeArrow({ page, side }) {
  return (
    <a href={page.href} className="edge-arrow" style={{
      position: "fixed", top: "50%", [side]: 14, transform: "translateY(-50%)", zIndex: 30,
      display: "flex", flexDirection: "column", alignItems: "center", gap: 6, textDecoration: "none",
      fontFamily: FONT, fontSize: 10, color: T.outline,
    }}>
      <span style={{ width: 46, height: 46, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                     fontSize: 22, border: `2px solid ${T.outline}`, background: "rgba(10,16,32,.85)" }}>{side === "left" ? "‹" : "›"}</span>
      <span>{page.label}</span>
    </a>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 2b  SOURCES AND DEFINITIONS
//
//  DEF   how each number is defined, broken into steps (same ^{…}
//        superscript markup as the values).
//  SRC   where to check it.  Keys refer to LINKS below.
//  A step that says “the wiki” is something I could not confirm
//  outside the Googology Wiki.
// ═══════════════════════════════════════════════════════════════
const LINKS = {
  wiki:     ["List of numbers (Googology Wiki)", "https://googology.miraheze.org/wiki/List_of_numbers"],
  shortlong:["Long and short scales (Wikipedia)", "https://en.wikipedia.org/wiki/Long_and_short_scales"],
  names:    ["Names of large numbers (Wikipedia)", "https://en.wikipedia.org/wiki/Names_of_large_numbers"],
  indian:   ["Indian numbering system (Wikipedia)", "https://en.wikipedia.org/wiki/Indian_numbering_system"],

  "Loader’s number": ["The 2001 Bignum Bakeoff asked for a C program of 512 characters or fewer that prints the largest number.", "Ralph Loader’s winning program implements a parser, type-checker and interpreter for the Huet–Coquand calculus of constructions and runs over its proofs.", "The wiki defines the output as D^{5}(99), where D(k) collects the typings provable in about log k inference steps.", "It is computable, so the busy beaver function eventually outgrows it."],
  "Σ(745)": ["A busy beaver number: Σ(n) is the most 1s that an n-state Turing machine can leave on its tape before halting.", "The related BB(n) counts steps: BB(5) = 47,176,870, proved in 2024 by the bbchallenge project.", "Yedidia and Aaronson (2016) built a 7,910-state machine whose halting depends on ZFC being consistent; it was later cut to 748 states. Beyond such sizes, ZFC cannot settle the value.", "The wiki lists Σ(745) as the smallest known one unprovable in ZFC. I could confirm the 748-state result but not the figure 745."],
  "Σ(1919)": ["Σ(n) is the busy beaver function, as in Σ(745).", "The wiki gives Σ(1919) as an upper bound for the smallest busy beaver number that ZFC cannot prove a value for. I could not confirm it outside the wiki."],
  "Rayo’s number": ["Rayo(n) is the smallest number bigger than any finite number that a first-order set-theory formula using at most n symbols can name.", "Rayo’s number is Rayo(10^{100}).", "It was the winning entry in a big-number duel at MIT. Its definition is a form of the Berry paradox, made precise by fixing the language."],
  "BIG FOOT": ["The wiki lists FOOT(10^{100}) under this name and flags it as ill-defined.", "I could not find it defined anywhere outside the wiki."],
  "Little Bigeddon": ["The wiki lists em(12↑↑12) and flags it as ill-defined.", "I could not find it defined anywhere outside the wiki."],
  "Sasquatch": ["The wiki lists em₂(12↑↑12), a one-level extension of Little Bigeddon, and flags it as ill-defined.", "I could not find it defined anywhere outside the wiki."],
  "Hollom’s number": ["Lawrence Hollom invented the iota function, a pseudo-function meant to grow as fast as possible.", "The wiki gives the number as about I(6.895 × 10^{104})(200) and flags it as very ill-defined."],
};

// ═══════════════════════════════════════════════════════════════
//  § 2c  WHERE EACH NUMBER SITS ON THE LINE
//
//  Scaled mode stitches four scales end to end:
//    up to a googol    one unit per power of ten (each unit is ×10)
//    up to 10↑↑12      one tower level ("10 to the power of") = 40 units
//    up to 10↑↑1,000   the tower's height, on a log scale
//    beyond            the height of the height, on a log-log scale
//  The notation-defined numbers after Googolgoogolplex cannot be
//  compared by size, so they are placed in order only.
//  A magnitude is {lg: log10 of the value} or {t: [h, v]}, meaning
//  10^10^…^v with h tens.
// ═══════════════════════════════════════════════════════════════
const MAG = {
  "One": { lg: 0 }, "Ten": { lg: 1 }, "Hundred": { lg: 2 }, "Thousand": { lg: 3 }, "Myriad": { lg: 4 }, "Lakh": { lg: 5 },
  "Million": { lg: 6 }, "Crore": { lg: 7 }, "Hundred million": { lg: 8 }, "Billion": { lg: 9 }, "Trillion": { lg: 12 },
  "Quadrillion": { lg: 15 }, "Quintillion": { lg: 18 }, "Sextillion": { lg: 21 }, "Avogadro’s number": { lg: 23.78 },
  "Septillion": { lg: 24 }, "Octillion": { lg: 27 }, "Nonillion": { lg: 30 }, "Decillion": { lg: 33 },
  "Undecillion … Novemdecillion": { lg: 48 }, "Vigintillion": { lg: 63 }, "Eddington’s number": { lg: 79.2 }, "Googol": { lg: 100 },
  "Planck volumes in the universe": { lg: 185.66 }, "Centillion": { lg: 303 }, "Short Infinity": { lg: 308.25 }, "Faxul": { lg: 374.9 },
  "Googolchime": { lg: 1000 }, "Millillion": { lg: 3003 },
  "Largest known prime": { lg: 41024319.9 }, "Trialogue": { lg: 1e10 }, "Ballium’s number": { lg: 138732019349.3 }, "3↑↑4": { lg: 3638334640024.1 },
  "Googolplex": { t: [2, 100] }, "Googolbang": { t: [1, 9.957e101] }, "Kilofaxul": { t: [2, 377.47] }, "Googolplexichime": { t: [2, 1000] },
  "Tetralogue": { t: [3, 10] }, "First Skewes number": { t: [3, 34] }, "Googolduplex": { t: [3, 100] }, "Megafaxul": { t: [3, 377.47] },
  "Second Skewes number": { t: [3, 963] }, "Googolduplexichime": { t: [3, 1000] }, "Pentalogue": { t: [4, 10] }, "Poincaré’s number": { t: [4, 13] },
  "Googoltriplex": { t: [4, 100] }, "Hexalogue": { t: [5, 10] }, "Octalogue": { t: [7, 10] }, "Hexadekalogue": { t: [15, 10] },
  "Mega": { t: [257, 10] }, "Megalogue": { t: [999999, 10] }, "Tritri": { t: [7.6e12, 10] }, "Googolgoogolplex": { t: [1e100, 10] },
};
const slPlain = x => x < 10 ? Math.log10(Math.max(1, x)) : 1 + slPlain(Math.log10(x));
const slogOf = m => m.t ? m.t[0] + slPlain(m.t[1]) : (m.lg < 1 ? m.lg : 1 + slPlain(m.lg));
const S_GOOGOL = 1 + slPlain(100), P_TOWER = 100, W_TOWER = 40;
const P12 = P_TOWER + (12 - S_GOOGOL) * W_TOWER, P3 = P12 + 60 * Math.log10(1e3 / 12);
function scaledPos(m) {
  if (m.lg !== undefined && m.lg <= 100) return m.lg;
  const s = slogOf(m);
  if (s <= 12) return P_TOWER + (s - S_GOOGOL) * W_TOWER;
  if (s <= 1e3) return P12 + 60 * Math.log10(s / 12);
  return P3 + 120 * Math.log10(Math.log10(s) / 3);
}
const LAST_SCALED = Math.max(...ENTRIES.filter(e => MAG[e.n]).map(e => scaledPos(MAG[e.n])));
{
  let k = 0;
  ENTRIES.forEach((e, i) => {
    e.i = i;
    if (MAG[e.n]) e.pos = scaledPos(MAG[e.n]);
    else { e.ord = true; e.pos = LAST_SCALED + 40 + k * 35; k++; }
  });
}

// ═══════════════════════════════════════════════════════════════
//  § 4  THE LINE
//  One row.  The view glides to each card: it zooms so the previous
//  and next numbers stay in sight, and the vertical line marks the
//  current one.  In "even" mode every number gets an equal step and
//  the whole list is shown, with the line moving instead.
// ═══════════════════════════════════════════════════════════════
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const posOf = (e, even) => (even ? e.i : e.pos);
const SUPD = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const supNum = n => String(n).split("").map(d => SUPD[d]).join("");

function viewFor(i, even) {
  if (even) return { c: (N - 1) / 2, w: N / 2 + 1 };
  const e = ENTRIES[i];
  const a = i > 0 ? e.pos - ENTRIES[i - 1].pos : 0, b = i < N - 1 ? ENTRIES[i + 1].pos - e.pos : 0;
  return { c: e.pos, w: clamp(Math.max(a, b) * 2.4, 5, 700) };
}
function zoneCaption(c, even) {
  if (even) return "evenly spaced: one step per number, not to scale";
  if (c <= 100.5) return "to scale: each step along the line is ×10 (one more digit)";
  if (c <= P12) return "to scale: each tower level is one more “10 to the power of”";
  if (c <= LAST_SCALED + 1) return "to scale: the height of the tower, squeezed (logarithmic)";
  return "from here on, sizes cannot be compared: spaced by order only";
}

function SlideLine({ idx, even, onGo }) {
  const box = useRef(null), drag = useRef(null), curView = useRef(null), goal = useRef(null);
  goal.current = viewFor(idx, even);
  if (!curView.current) curView.current = goal.current;
  const [view, setView] = useState(curView.current);
  const [width, setWidth] = useState(800);
  const [hover, setHover] = useState(null);

  useEffect(() => {
    const ro = new ResizeObserver(([en]) => setWidth(en.contentRect.width));
    ro.observe(box.current);
    return () => ro.disconnect();
  }, []);

  // glide toward the goal view (position and zoom both ease in log space)
  useEffect(() => {
    let raf, last = performance.now();
    const step = now => {
      raf = requestAnimationFrame(step);
      const dt = Math.min(50, now - last); last = now;
      if (drag.current && drag.current.moved) return;
      const c = curView.current, g = goal.current, k = 1 - Math.exp(-dt / 140);
      const lw = Math.log(c.w) + (Math.log(g.w) - Math.log(c.w)) * k;
      const nc = c.c + (g.c - c.c) * k;
      const done = Math.abs(g.c - nc) < 1e-3 * g.w && Math.abs(lw - Math.log(g.w)) < 1e-3;
      const next = done ? g : { c: nc, w: Math.exp(lw) };
      if (next.c !== c.c || next.w !== c.w) { curView.current = next; setView(next); }
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, []);

  const X = p => 500 + ((p - view.c) / view.w) * 470;                 // viewBox x
  const pxPerUnit = (width / 1000) * 470 / view.w;
  const posAtClientX = cx => {
    const r = box.current.getBoundingClientRect();
    return view.c + (((cx - r.left) / r.width) * 1000 - 500) / 470 * view.w;
  };
  const nearest = p => {
    let best = 0, bd = Infinity;
    ENTRIES.forEach((e, i) => { const d = Math.abs(posOf(e, even) - p); if (d < bd) { bd = d; best = i; } });
    return best;
  };

  const down = ev => {
    box.current.setPointerCapture(ev.pointerId);
    drag.current = { x: ev.clientX, c: curView.current.c, w: curView.current.w, moved: false };
  };
  const move = ev => {
    const p = posAtClientX(ev.clientX);
    setHover(nearest(p));
    const d = drag.current;
    if (!d) return;
    if (!d.moved && Math.abs(ev.clientX - d.x) < 4) return;
    d.moved = true;
    if (even) { onGo(nearest(p)); return; }
    const ppu = (width / 1000) * 470 / d.w;
    const c = d.c - (ev.clientX - d.x) / ppu;
    curView.current = { c, w: d.w }; setView(curView.current);
    onGo(nearest(c));
  };
  const up = ev => {
    const d = drag.current; drag.current = null;
    if (d && !d.moved) {                                                   // a click: pick the nearest tick
      const i = nearest(posAtClientX(ev.clientX));
      if (Math.abs(X(posOf(ENTRIES[i], even)) - ((ev.clientX - box.current.getBoundingClientRect().left) / width) * 1000) < 22) onGo(i);
    }
  };

  // labels for the current number and its neighbours, kept from overlapping
  const labels = [];
  const taken = [];
  [0, -1, 1, -2, 2].forEach(off => {
    const i = idx + off;
    if (i < 0 || i >= N) return;
    const e = ENTRIES[i], px = (X(posOf(e, even)) / 1000) * width;
    if (px < 30 || px > width - 30) return;
    const text = e.n.length > 22 ? e.n.slice(0, 21) + "…" : e.n, w = text.length * 6.3 + 12;
    if (taken.some(([a, b]) => px - w / 2 < b && px + w / 2 > a)) return;
    taken.push([px - w / 2, px + w / 2]);
    labels.push({ i, px, text, on: off === 0 });
  });

  // axis: powers of ten in the first zone, tower levels in the second
  const axis = [];
  if (!even) {
    const lo = view.c - view.w, hi = view.c + view.w;
    if (lo < 100) {
      const raw = 56 / pxPerUnit, step = [1, 2, 5, 10, 20, 50].find(s => s >= raw) || 50;
      for (let k = Math.max(0, Math.ceil(lo / step) * step); k <= Math.min(100, hi); k += step) axis.push([k, k === 0 ? "1" : "10" + supNum(k)]);
    }
    if (hi > P_TOWER && lo < P12) {
      for (let s = 3; s <= 12; s++) { const p = P_TOWER + (s - S_GOOGOL) * W_TOWER; if (p >= lo && p <= hi) axis.push([p, s === 3 ? "10¹⁰¹⁰" : `10↑↑${s}`]); }
    }
  }

  return (
    <div ref={box} style={{ position: "relative", height: 104, touchAction: "none", cursor: even ? "pointer" : "grab", userSelect: "none" }}
         onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={() => setHover(null)}>
      {even && CH.map((c, k) => {
        const x = (X((CH_START[k] + CH_END[k]) / 2) / 1000) * width;
        return <div key={k} style={{ position: "absolute", top: 0, left: x, transform: "translateX(-50%)", fontSize: 10, whiteSpace: "nowrap",
                                     color: idx >= CH_START[k] && idx <= CH_END[k] ? T.outline : "#4b5d73", pointerEvents: "none" }}>{width < 560 ? k + 1 : c.short}</div>;
      })}
      {labels.map(l => (
        <div key={l.i} style={{ position: "absolute", top: even ? 18 : 6, left: l.px, transform: "translateX(-50%)", fontSize: 11, whiteSpace: "nowrap",
                                color: l.on ? T.outline : "#6b7e96", fontWeight: l.on ? 600 : 400, pointerEvents: "none" }}>{l.text}</div>
      ))}
      <svg viewBox="0 0 1000 40" preserveAspectRatio="none" style={{ position: "absolute", left: 0, top: 38, width: "100%", height: 40 }}>
        {even && CH.map((c, k) => {
          const x0 = X(CH_START[k] - 0.5), x1 = X(CH_END[k] + 0.5);
          return <rect key={k} x={x0} y={0} width={x1 - x0} height={40} fill={k % 2 ? "#0e1828" : "#101c30"} />;
        })}
        <line x1={0} x2={1000} y1={20} y2={20} stroke="#1e2d3d" vectorEffect="non-scaling-stroke" />
        {ENTRIES.map((e, i) => {
          const x = X(posOf(e, even));
          if (x < -10 || x > 1010) return null;
          return <line key={i} x1={x} x2={x} y1={even ? 15 : (i === idx ? 10 : 14)} y2={even ? 25 : (i === idx ? 30 : 26)} stroke={i <= idx ? "#4b6a94" : "#2b3d55"} vectorEffect="non-scaling-stroke" />;
        })}
        <line x1={X(posOf(ENTRIES[idx], even))} x2={X(posOf(ENTRIES[idx], even))} y1={2} y2={38} stroke={T.accent} strokeWidth={2} vectorEffect="non-scaling-stroke" />
      </svg>
      {axis.map(([p, text], k) => (
        <div key={k} style={{ position: "absolute", top: 80, left: `${X(p) / 10}%`, transform: "translateX(-50%)", fontSize: 9.5, color: "#4b5d73", whiteSpace: "nowrap", pointerEvents: "none" }}>{text}</div>
      ))}
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, textAlign: "center", fontSize: 10, color: "#4b5d73", pointerEvents: "none" }}>{zoneCaption(view.c, even)}</div>
      {hover !== null && hover !== idx && !drag.current && (
        <div style={{ position: "absolute", top: 24, left: `${X(posOf(ENTRIES[hover], even)) / 10}%`, transform: "translate(-50%,-100%)",
                      background: "#0e1828", border: "1px solid #1e2d3d", borderRadius: 6, padding: "2px 8px", fontSize: 10, color: "#cbd5e1",
                      whiteSpace: "nowrap", pointerEvents: "none", zIndex: 5 }}>{ENTRIES[hover].n}</div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 5  APP
// ═══════════════════════════════════════════════════════════════
const fromHash = () => {

};
const ONE_LINE = { display: "block", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" };

}

  const e = ENTRIES[idx], next = ENTRIES[idx + 1], ch = CH[e.c];
  const srcs = (SRC[e.n] || []).map(k => LINKS[k]);
  const steps = DEF[e.n] || [];

  const go = (i, keepPlaying) => {
    setIdx(clamp(i, 0, N - 1));
    if (!keepPlaying) setPlaying(false);
  };

  const nextChapter = () => go(e.c < CH.length - 1 ? CH_START[e.c + 1] : N - 1);

  useEffect(() => { try { history.replaceState(null, "", "#" + e.id); } catch (_) { /* file:// */ } }, [e.id]);
  useEffect(() => {

  }, []);
  useEffect(() => {

  }, [playing]);
  useEffect(() => {

      const tag = ev.target.tagName;

    return () => window.removeEventListener("keydown", onKey);

          <div style={{ fontSize: 9, color: "#4b5d73", marginTop: 2, letterSpacing: "0.09em", textTransform: "uppercase" }}>a walk up the googology wiki’s list of numbers</div>

              </span>
            </span>
            <span style={{ fontSize: 22, color: T.outline }}>→</span>
          </a>
        ) : (
          <a className="next" href={"#" + ENTRIES[0].id} onClick={ev => { ev.preventDefault(); go(0); }}
             style={{ flex: 1, minWidth: 0, height: 52, padding: "0 14px", background: T.a(40, 0.2), border: `1px solid ${T.a(62, 0.35)}`, color: T.outline, justifyContent: "space-between" }}>
            <span style={{ ...ONE_LINE, fontSize: 13 }}>End of the list. Start again from One</span><span style={{ fontSize: 20 }}>↺</span>
          </a>
        )}
        <button className="btn" onClick={() => setPlaying(p => !p)} title="play the journey (P)" style={{ width: 40, color: playing ? "#fff" : "#94a3b8", background: playing ? T.cell : "#0e1828" }}>{playing ? "❚❚" : "▶"}</button>
        <button className="btn" onClick={nextChapter} disabled={idx === N - 1} title="skip ahead a chapter" style={{ width: 46 }}>… ⟫</button>
      </div>

      {/* the card */}
      <div key={e.id} className="flip" style={{ width: W, background: "#0e1828", border: "1px solid #16233a", borderRadius: 16, padding: "18px 20px 16px" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", fontSize: 10, color: "#64748b", marginBottom: 6 }}>
          <span style={{ color: T.outline }}>{ch.name}</span><span>·</span><span>{idx + 1} of {N}</span>
          {e.x && <><span>·</span><span style={{ color: "#c08a4a" }}>{e.x}</span></>}
          {e.ord && !even && <><span>·</span><span style={{ color: "#c08a4a" }}>placed by order only</span></>}
        </div>
        {e.v !== e.n && <div style={{ fontFamily: DISP, fontSize: 20, color: T.outline }}>{e.n}</div>}
        <div style={{ fontFamily: DISP, fontSize: fs, color: e.v === e.n ? T.outline : "#f1f5f9", margin: "4px 0 2px", lineHeight: 1.15, overflowWrap: "anywhere" }}><Val s={e.v} /></div>
        {e.a && <div style={{ fontSize: 13, color: "#94a3b8", marginBottom: 2 }}><Val s={e.a} /></div>}
        <div style={{ fontSize: 12.5, color: "#a5b4c8", lineHeight: 1.65, marginTop: 10, maxWidth: 680 }}><Val s={e.t} /></div>

        {steps.length > 0 && (
          <div style={{ marginTop: 14, maxWidth: 680 }}>
            <span style={label}>how it is defined</span>
            <ol style={{ margin: 0, paddingLeft: 20, fontSize: 12, color: "#b6c3d4", lineHeight: 1.7 }}>
              {steps.map((st, k) => <li key={k} style={{ marginBottom: 3 }}><Val s={st} /></li>)}
            </ol>
          </div>
        )}
        {e.s && (
          <div style={{ marginTop: 14, padding: "8px 12px", borderLeft: `2px solid ${T.outline}`, background: T.a(40, 0.12), borderRadius: "0 8px 8px 0", maxWidth: 680 }}>
            <span style={{ ...label, marginBottom: 2 }}>to get a feel for it</span>
            <span style={{ fontSize: 12.5, color: "#cbd5e1", lineHeight: 1.6 }}>{e.s}</span>
          </div>
        )}
        {e.l && <a href={e.l[0]} style={{ display: "inline-block", marginTop: 12, fontSize: 11, color: T.outline, textDecoration: "none", border: `1px solid ${T.a(62, 0.3)}`, borderRadius: 8, padding: "4px 10px" }}>▦ {e.l[1]} →</a>}

        <div style={{ marginTop: 14, fontSize: 10.5, color: "#64748b", lineHeight: 1.8 }}>
          <span style={{ ...label, color: "#4b5d73", marginBottom: 2 }}>sources</span>
          {srcs.map(([text, url], k) => (
            <span key={k}>{k > 0 && " · "}<a href={url} target="_blank" rel="noopener" style={{ color: "#8aa0bd" }}>{text}</a></span>
          ))}
          {srcs.length > 0 && " · "}
          <a href={LINKS.wiki[1]} target="_blank" rel="noopener" style={{ color: "#8aa0bd" }}>{LINKS.wiki[0]}</a>
          {srcs.length === 0 && ENTRIES[idx].c !== 0 && <span style={{ display: "block", color: "#7d6a4a" }}>Only the Googology Wiki lists this one; I found no independent source.</span>}
        </div>
      </div>

      <div style={{ width: W, marginTop: 8, fontSize: 10, color: "#4b5d73", lineHeight: 1.7 }}>
        {ch.blurb} Drag the line, press → or Space for the next number, Shift + → for the next chapter, P to play.
      </div>
      <div style={{ width: W, marginTop: 12, fontSize: 10, color: "#4b5d73", lineHeight: 1.7, borderTop: "1px solid #16233a", paddingTop: 10 }}>
        Names, values and order follow the Googology Wiki’s “List of numbers”,
        {" "}<a href="https://googology.miraheze.org/wiki/List_of_numbers" target="_blank" rel="noopener" style={{ color: "#64748b" }}>googology.miraheze.org/wiki/List_of_numbers</a>,
        a selection of the notable entries from a far longer list. Definitions, dates and comparisons are checked against the outside sources listed on each card.
        Where I could only find a number on the wiki, the card says so. Names are conventions (“billion” and “trillion” differ between countries), and the wiki flags some entries as ill-defined.
        Comparisons use rounded, commonly cited estimates.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
