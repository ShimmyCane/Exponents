<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Number Line</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #0a1020; }
    * { box-sizing: border-box; }
    .bt { cursor: pointer; border: none; transition: all .18s; }
    .bt:hover:not(:disabled) { filter: brightness(1.25); }
    .bt:disabled { opacity: .35; cursor: default; }
    .nav-btn:hover:not(:disabled) { filter: brightness(1.3); transform: scale(1.08); }
    .nav-btn:active:not(:disabled) { transform: scale(0.92); }
    .series:hover { filter: brightness(1.3); }
    .edge-arrow:hover { filter: brightness(1.35); }
    @media (max-width: 1060px) { .edge-arrow { display: none !important; } }
    .track { scrollbar-width: thin; scrollbar-color: #1e2d3d transparent; }
    .track::-webkit-scrollbar { height: 6px; }
    .track::-webkit-scrollbar-thumb { background: #1e2d3d; border-radius: 3px; }
    .tick { cursor: pointer; }
    .tick:hover text { fill: #e2e8f0; }
    .pt-note { animation: rowIn .35s ease both; }
    @keyframes rowIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    sup.p { font-size: 0.68em; vertical-align: 0.55em; line-height: 0; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
//  § 1  CONFIG
// ═══════════════════════════════════════════════════════════════
const CFG = {
  PX: 320,              // pixels per unit of super-log (one level of "10 to the power of")
  PAD: 90,              // space left of the start of the line
  SMAX: 9,              // right end of the line, in super-log units
  TIER: 3,              // label rows, so neighbouring labels don't collide
};
const FONT = "'DM Mono', monospace";
const DISP = "'DM Serif Display', serif";
const HUE = 213;
const theme = {
  accent: `hsl(${HUE},75%,62%)`, outline: `hsl(${HUE},80%,72%)`, cell: `hsl(${HUE},65%,48%)`,
  a: (l, a) => `hsla(${HUE},75%,${l}%,${a})`,
};

// ═══════════════════════════════════════════════════════════════
//  § 2  NUMBERS
//
//  A value is {h, v}: h tens stacked over v, i.e. 10^10^…^v with h tens
//  (h = 0 is just v itself).  The super-log s(x) counts how many times
//  you can take log10 before x drops below 10 — so each whole step on the
//  line is exactly one more "10 to the power of".  That is the scale.
// ═══════════════════════════════════════════════════════════════
const slPlain = x => x < 10 ? Math.log10(Math.max(1, x)) : 1 + slPlain(Math.log10(x));
const sOf = r => r.h + slPlain(r.v);
const xOf = s => CFG.PAD + s * CFG.PX;

function norm({ h, v }) {
  while (h > 0 && v < 15) { v = Math.pow(10, v); h--; }
  while (v >= 1e15) { v = Math.log10(v); h++; }
  return { h, v };
}
function up(r) {                    // 10^x : one more tens tower level
  if (r.h >= 1) return { h: r.h + 1, v: r.v };
  return { h: 1, v: Math.log10(r.v) };
}
function down(r) {                  // log10 x : one fewer level (only when it stays exact enough)
  if (r.h >= 2) return { h: r.h - 1, v: r.v };
  if (r.h === 1 && r.v < 300) return { h: 0, v: Math.pow(10, r.v) };
  if (r.h === 0 && r.v > 10) return { h: 0, v: Math.log10(r.v) };
  return null;
}

const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const sup = n => String(n).split("").map(d => SUP[d]).join("");
const fmt = v => v.toLocaleString("en-US");
function readable(r) {
  if (r.h === 0) {
    if (r.v < 1e6) return fmt(r.v);
    const e = Math.floor(Math.log10(r.v));
    return `${(r.v / Math.pow(10, e)).toFixed(2)} × 10${sup(e)}`;
  }
  if (r.h <= 3) {
    let inner = `${Number.isInteger(r.v) ? fmt(r.v) : r.v.toPrecision(3)}`;
    for (let i = 0; i < r.h; i++) inner = `10^(${inner})`;
    return inner;
  }
  return `10↑↑${r.h} (${r.h} tens, top ${r.v})`;
}
function digitsOf(r) {
  if (r.h === 0) return r.v < 1e15 ? fmt(Math.floor(Math.log10(r.v)) + 1) : null;
  if (r.h === 1) return fmt(Math.floor(r.v) + 1);
  return null;
}

// ═══════════════════════════════════════════════════════════════
//  § 3  POINTS ON THE LINE
//
//  Source: the uploaded copy of the Googology Wiki "List of numbers"
//  (marked "wiki") or a standard reference (marked "std").
// ═══════════════════════════════════════════════════════════════
const POINTS = [
  { name: "One",                 r: { h: 0, v: 1 },       src: "wiki", note: "The starting line. Every number on this page is one more “10 to the power of” than the one before it." },
  { name: "Ten",                 r: { h: 0, v: 10 },      src: "wiki", note: "The base of our counting system: ten fingers, ten symbols, and the first power of ten." },
  { name: "Thousand",            r: { h: 0, v: 1e3 },     src: "wiki", note: "1,000. Above it, the short scale names each power of a thousand: million, billion, trillion, and so on." },
  { name: "Million",             r: { h: 0, v: 1e6 },     src: "wiki", note: "The first name that really feels big. It is 1,000 thousands." },
  { name: "Billion",             r: { h: 0, v: 1e9 },     src: "wiki", note: "10⁹ in the short scale. Older British usage (the long scale) used a billion for 10¹² — a reminder that names are conventions." },
  { name: "Trillion",            r: { h: 0, v: 1e12 },    src: "wiki", note: "10¹². A trillion seconds is about 31,700 years." },
  { name: "Quadrillion",         r: { h: 0, v: 1e15 },    src: "wiki", note: "10¹⁵. A quadrillion seconds is about 31.7 million years." },
  { name: "Quintillion",         r: { h: 0, v: 1e18 },    src: "wiki", note: "10¹⁸. Grains of sand on all of Earth's beaches are in this range." },
  { name: "Decillion",           r: { h: 0, v: 1e33 },    src: "wiki", note: "10³³. The short scale keeps going this way, one ‘-illion’ per thousand, all the way to centillion (10³⁰³)." },
  { name: "Avogadro's number",   r: { h: 0, v: 6.022e23 }, src: "wiki", note: "Particles in one mole: the number of atoms in 12 g of carbon-12. It is a counting number that chemists actually use." },
  { name: "Eddington's number",  r: { h: 0, v: 1.5748e79 }, src: "wiki", note: "Arthur Eddington's 1938 estimate of the protons in the observable universe (about 136 · 2²⁵⁶)." },
  { name: "Googol",              r: { h: 1, v: 100 },     src: "wiki", note: "1 followed by 100 zeros. Coined in 1938 by Milton Sirotta, aged nine, and named by his uncle, the mathematician Edward Kasner." },
  { name: "Centillion (short)",  r: { h: 0, v: 1e303 },   src: "wiki", note: "10³⁰³ in the short scale. The googol (10¹⁰⁰) sits well below it, between decillion and centillion." },
  { name: "Planck volumes",      r: { h: 0, v: 4.6e185 }, src: "wiki", note: "About 4.6 × 10¹⁸⁵ Planck volumes fit in the observable universe. A Planck volume is the smallest volume with meaning in current physics." },
  { name: "Googolplex",          r: { h: 2, v: 100 },     src: "std",  note: "10 raised to a googol. It has more digits than there are atoms in the observable universe, so you cannot write it out." },
  { name: "Skewes' number",      r: { h: 3, v: 34 },      src: "std",  note: "Skewes (1933) gave an upper bound for the first number x where the prime count π(x) overtakes the logarithmic integral li(x). It was the largest number ever used in a serious proof for many decades." },
  { name: "Googolplexian",       r: { h: 3, v: 100 },     src: "std",  note: "10 raised to a googolplex: the next rung of the same ladder." },
];
// Numbers that grow faster than any tower on this line: they sit past its right end.
const BEYOND = [
  { name: "Graham's number", note: "An upper bound in a Ramsey-theory problem (Graham, 1971). It needs 64 layers of up-arrows, so no finite power tower can hold it.", src: "std" },
  { name: "TREE(3)",         note: "From Kruskal's tree theorem: the longest possible sequence of labelled trees. It is far larger than Graham's number.", src: "std" },
  { name: "Rayo's number",   note: "The smallest number bigger than any number nameable by a first-order set-theory sentence of a googol symbols.", src: "std" },
];
const SORTED = POINTS.map(p => ({ ...p, s: sOf(p.r) })).sort((a, b) => a.s - b.s);

const ZONES = [
  { from: 0, to: 1, label: "counting and names" },
  { from: 1, to: 2, label: "thousands, millions, billions" },
  { from: 2, to: 3, label: "googol, and the names beyond it" },
  { from: 3, to: 4, label: "googolplex: a power of a power" },
  { from: 4, to: 9, label: "towers of tens" },
];

// ═══════════════════════════════════════════════════════════════
//  § 4  NAV (same series as the other pages)
// ═══════════════════════════════════════════════════════════════
const SERIES = [
  { href: "index.html",   label: "Exponents",   tag: "bⁿ" },
  { href: "uparrow.html", label: "Up-arrows",   tag: "a↑↑n" },
  { href: null,           label: "Number line", tag: "you are here" },
];
function EdgeArrows({ current }) {
  const arrow = (p, side) => {
    if (!p) return null;
    const st = {
      position: "fixed", top: "50%", [side]: 14, transform: "translateY(-50%)", zIndex: 30,
      display: "flex", flexDirection: "column", alignItems: "center", gap: 6, textDecoration: "none",
      fontFamily: FONT, fontSize: 10, color: p.href ? theme.outline : "#4b5d73", opacity: p.href ? 1 : 0.6,
    };
    const circle = (
      <span style={{
        width: 46, height: 46, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 22, border: `2px solid ${p.href ? theme.outline : "#1e2d3d"}`, background: "rgba(10,16,32,.85)",
      }}>{side === "left" ? "‹" : "›"}</span>
    );
    const text = <span style={{ textAlign: "center", lineHeight: 1.3 }}>{p.label}<br /><span style={{ opacity: 0.6 }}>{p.tag}</span></span>;
    return p.href
      ? <a key={side} href={p.href} className="edge-arrow" style={st}>{circle}{text}</a>
      : <span key={side} className="edge-arrow" style={st}>{circle}{text}</span>;
  };
  return <>{arrow(SERIES[current - 1], "left")}{arrow(SERIES[current + 1], "right")}</>;
}

// ═══════════════════════════════════════════════════════════════
//  § 5  THE LINE
// ═══════════════════════════════════════════════════════════════
function Line({ cur, curS, selected, onPick }) {
  const W = CFG.PAD * 2 + CFG.SMAX * CFG.PX, LINE = 150;
  const curX = xOf(Math.min(curS, CFG.SMAX));

  // Greedy label stacking: each name takes the lowest row where it fits
  // without touching the names already placed there.
  const rows = [];
  const tiers = SORTED.map(p => {
    const w = (p.name.length + (p.src === "std" ? 2 : 0)) * 6.6 + 6, x = xOf(p.s);
    let k = rows.findIndex(r => r.every(([a, b]) => x + w / 2 < a || x - w / 2 > b));
    if (k < 0) { rows.push([]); k = rows.length - 1; }
    rows[k].push([x - w / 2, x + w / 2]);
    return k;
  });
  const rowY = k => LINE - 34 - k * 15;

  return (
    <svg width={W} height={236} style={{ display: "block" }}>
      {/* the line itself and its super-log ticks */}
      <line x1={xOf(0)} x2={xOf(CFG.SMAX)} y1={LINE} y2={LINE} stroke="#1e2d3d" strokeWidth={2} />
      {Array.from({ length: CFG.SMAX + 1 }, (_, t) => (
        <g key={t}>
          <line x1={xOf(t)} x2={xOf(t)} y1={LINE - 8} y2={LINE + 8} stroke="#33475e" strokeWidth={1.5} />
          <text x={xOf(t)} y={LINE + 22} textAnchor="middle" fill="#4b5d73" fontSize={10} fontFamily={FONT}>
            {t === 0 ? "1" : t === 1 ? "10" : t === 2 ? "10¹⁰" : t === 3 ? "10¹⁰¹⁰" : `10↑↑${t}`}
          </text>
        </g>
      ))}

      {/* points */}
      {SORTED.map((p, i) => {
        const x = xOf(p.s), y = rowY(tiers[i]), on = selected === p.name;
        return (
          <g key={p.name} className="tick" onClick={() => onPick(p.name)}>
            <line x1={x} x2={x} y1={y + 3} y2={LINE} stroke={on ? theme.outline : "#26364a"} strokeWidth={on ? 1.5 : 1} />
            <circle cx={x} cy={LINE} r={on ? 5 : 3.5} fill={on ? theme.outline : "#64748b"} />
            <text x={x} y={y} textAnchor="middle" fill={on ? theme.outline : "#64748b"} fontSize={11} fontFamily={FONT}>
              {p.name}{p.src === "std" ? " †" : ""}
            </text>
          </g>
        );
      })}

      {/* you are here */}
      <g>
        <line x1={curX} x2={curX} y1={LINE - 14} y2={LINE + 36} stroke={theme.accent} strokeWidth={2} />
        <circle cx={curX} cy={LINE} r={7} fill={theme.accent} />
        <text x={curX} y={LINE + 50} textAnchor="middle" fill={theme.outline} fontSize={11} fontFamily={FONT} fontWeight={600}>you are here</text>
      </g>

      {/* zones, along the bottom */}
      {ZONES.map((z, i) => (
        <g key={i}>
          <rect x={xOf(z.from)} y={216} width={xOf(z.to) - xOf(z.from)} height={16} fill={i % 2 ? "#131e2e" : "#0e1828"} />
          <text x={xOf(z.from) + 6} y={228} fill="#4b5d73" fontSize={9} fontFamily={FONT}>{z.label}</text>
        </g>
      ))}
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 6  APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [cur, setCur]           = useState({ h: 0, v: 1 });
  const [selected, setSelected] = useState("One");
  const scroller = useRef(null);
  const curS = sOf(cur);
  const idx  = SORTED.findIndex(p => p.name === selected);
  const pick = SORTED[idx] ?? null;

  // Keep "you are here" in the middle of the view as the number grows.
  useEffect(() => {
    const el = scroller.current;
    if (!el) return;
    el.scrollTo({ left: xOf(Math.min(curS, CFG.SMAX)) - el.clientWidth / 2, behavior: "smooth" });
  }, [curS]);

  function choose(name) {
    const p = SORTED.find(x => x.name === name);
    if (!p) return;
    setSelected(name); setCur(p.r);
  }
  function step(dir) {
    const next = SORTED[Math.max(0, Math.min(SORTED.length - 1, idx + dir))];
    if (idx < 0) return choose(dir > 0 ? SORTED[0].name : SORTED[SORTED.length - 1].name);
    choose(next.name);
  }
  const upDisabled   = cur.h >= 9;
  const downDisabled = down(cur) === null;

  useEffect(() => {
    const onKey = e => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const digits = digitsOf(cur);
  const zone = ZONES.find(z => curS >= z.from && curS < z.to) ?? ZONES[ZONES.length - 1];

  return (
    <div style={{ minHeight: "100vh", background: "#0a1020", color: "#e2e8f0", fontFamily: FONT,
                  display: "flex", flexDirection: "column", alignItems: "center", padding: "16px 16px 32px" }}>
      <EdgeArrows current={2} />

      {/* Header */}
      <div style={{ width: "min(960px,100%)", display: "flex", alignItems: "center", marginBottom: 12 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: DISP, fontSize: "clamp(20px,3.6vw,28px)", color: theme.outline, textShadow: `0 0 20px ${theme.a(62, 0.3)}` }}>
            The Number Line
          </div>
          <div style={{ fontSize: 9, color: "#4b5d73", marginTop: 2, letterSpacing: "0.09em", textTransform: "uppercase" }}>
            every tick is one more “10 to the power of”
          </div>
        </div>
        <a href="index.html" style={{ fontSize: 11, color: theme.outline, border: `1px solid ${theme.a(62, 0.3)}`, borderRadius: 8, padding: "6px 10px", textDecoration: "none" }}>← exponents</a>
      </div>

      {/* Current number */}
      <div style={{ width: "min(960px,100%)", background: "#0e1828", border: `1px solid ${theme.a(62, 0.2)}`, borderRadius: 14, padding: "14px 18px", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", justifyContent: "center" }}>
          <button className="bt" onClick={() => setCur(down(cur))} disabled={downDisabled} title="take the log (one level down)"
            style={{ width: 40, height: 40, borderRadius: "50%", background: theme.cell, color: "#fff", fontSize: 18 }}>↓</button>
          <div style={{ fontFamily: DISP, fontSize: "clamp(20px,3.4vw,30px)", color: "#f1f5f9", textAlign: "center", minWidth: 240 }}>
            {readable(cur)}
          </div>
          <button className="bt" onClick={() => setCur(up(cur))} disabled={upDisabled} title="10 to the power of this (one level up)"
            style={{ width: 40, height: 40, borderRadius: "50%", background: theme.cell, color: "#fff", fontSize: 18 }}>↑</button>
        </div>
        <div style={{ textAlign: "center", fontSize: 11, color: "#64748b", marginTop: 8 }}>
          {digits ? `${digits} digit${digits === "1" ? "" : "s"} · ` : "far more digits than atoms in the universe · "}
          super-log {curS.toFixed(2)} · zone: {zone.label}
        </div>
      </div>

      {/* Line */}
      <div style={{ width: "min(960px,100%)", background: "#0e1828", borderRadius: 14, border: `1px solid ${theme.a(62, 0.15)}`, padding: "10px 0 6px" }}>
        <div ref={scroller} className="track" style={{ overflowX: "auto", position: "relative" }}>
          <Line cur={cur} curS={curS} selected={selected} onPick={choose} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 16px 0", fontSize: 11, color: "#64748b" }}>
          <button className="bt" onClick={() => step(-1)} disabled={idx === 0} style={{ padding: "4px 10px", borderRadius: 6, background: "#1e293b", color: "#cbd5e1" }}>← previous</button>
          <button className="bt" onClick={() => step(1)} disabled={idx === SORTED.length - 1} style={{ padding: "4px 10px", borderRadius: 6, background: "#1e293b", color: "#cbd5e1" }}>next →</button>
          <span style={{ marginLeft: "auto" }}>scroll sideways for the rest of the line</span>
        </div>
      </div>

      {/* Explanation */}
      <div key={selected} className="pt-note" style={{ width: "min(960px,100%)", marginTop: 12, background: "#0e1828", borderRadius: 12, padding: "12px 16px", border: `1px solid ${theme.a(62, 0.15)}`, minHeight: 74 }}>
        {pick ? (
          <>
            <div style={{ fontFamily: DISP, fontSize: 18, color: theme.outline }}>{pick.name}{pick.src === "std" ? " †" : ""}</div>
            <div style={{ fontSize: 12, color: "#a5b4c8", lineHeight: 1.6, marginTop: 4 }}>{pick.note}</div>
          </>
        ) : (
          <div style={{ fontSize: 12, color: "#64748b" }}>Click a tick, or use previous and next, to read about it.</div>
        )}
      </div>

      {/* Beyond the line */}
      <div style={{ width: "min(960px,100%)", marginTop: 12, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(260px,1fr))", gap: 10 }}>
        {BEYOND.map(b => (
          <div key={b.name} style={{ background: "#0e1828", borderRadius: 12, padding: "10px 14px", border: `1px solid ${theme.a(62, 0.12)}` }}>
            <div style={{ fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#4b5d73" }}>beyond the right edge</div>
            <div style={{ fontFamily: DISP, fontSize: 16, color: theme.outline, marginTop: 2 }}>{b.name} †</div>
            <div style={{ fontSize: 11, color: "#94a3b8", lineHeight: 1.55, marginTop: 4 }}>{b.note}</div>
          </div>
        ))}
      </div>

      {/* Footnotes */}
      <div style={{ width: "min(960px,100%)", marginTop: 16, fontSize: 10, color: "#4b5d73", lineHeight: 1.7 }}>
        <div>
          ¹ Names and approximate values marked without a dagger come from the Googology Wiki’s “List of numbers”,
          {" "}<a href="https://googology.miraheze.org/wiki/List_of_numbers" target="_blank" rel="noopener" style={{ color: "#64748b" }}>googology.miraheze.org/wiki/List_of_numbers</a>.
          The list is ordered by size, and its names are conventions: “billion” and “trillion” mean different things in different countries.
        </div>
        <div>
          † Standard reference points taken from the wider googology literature rather than from that list (Googolplex, Googolplexian, Skewes’ number, Graham’s number, TREE(3), Rayo’s number). These are shown for orientation only.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
