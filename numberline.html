<script type="text/babel">

  E(3, "Tritri", "3↑↑↑3", "a tower of 3s, not tens", "Bowers’ {3,3,3}: a tower of 3s about 7.6 trillion levels tall. The same number you reach with three arrows on the Up-arrows page.", { a: "= 3↑↑7,625,597,484,987", l: ["uparrow.html?base=3&arrows=3&n=3", "build it on the Up-arrows page"] }),
  E(3, "Googolgoogolplex", "10↑↑10^{100}", "tower height: 7.6 trillion → a googol", "A tower of tens a googol levels tall. The wiki also calls it Googol-stack."),
  // 4 · Up-arrows

const N = ENTRIES.length;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
ENTRIES.forEach(e => { e.id = slug(e.n); });
const CH_START = CH.map((_, c) => ENTRIES.findIndex(e => e.c === c));
const CH_END = CH.map((_, c) => ENTRIES.map(e => e.c).lastIndexOf(c));

// ═══════════════════════════════════════════════════════════════
//  § 2  TEXT WITH SUPERSCRIPTS
// ═══════════════════════════════════════════════════════════════
function parseVal(s) {
  let i = 0;
  const run = stop => {
    const out = []; let buf = "";
    while (i < s.length && s[i] !== stop) {
      if (s[i] === "^" && s[i + 1] === "{") {
        if (buf) { out.push(buf); buf = ""; }
        i += 2; const inner = run("}"); i++;
        out.push({ sup: inner });
      } else buf += s[i++];
    }
    if (buf) out.push(buf);
    return out;
  };
  return run(null);
}
const renderVal = nodes => nodes.map((n, k) =>
  typeof n === "string" ? <span key={k}>{n}</span>
    : <sup key={k} style={{ fontSize: "0.6em", verticalAlign: "0.55em" }}>{renderVal(n.sup)}</sup>);
const Val = ({ s }) => <>{renderVal(parseVal(s))}</>;

// ═══════════════════════════════════════════════════════════════
//  § 3  PAGE SWITCH + EDGE ARROWS (shared with the other pages)
// ═══════════════════════════════════════════════════════════════
const PAGES = [
  { href: "index.html", label: "Exponents" },
  { href: "uparrow.html", label: "Up-arrows" },
  { href: "numberline.html", label: "Number line" },
];
function PageSwitch({ current }) {
  return (
    <nav style={{ display: "inline-flex", border: `1px solid ${T.a(62, 0.3)}`, borderRadius: 8, overflow: "hidden", fontFamily: FONT, fontSize: 11, flexShrink: 0 }}>
      {PAGES.map((p, i) => (
        <a key={p.href} href={p.href} style={{
          padding: "5px 10px", textDecoration: "none", whiteSpace: "nowrap",
          background: i === current ? T.outline : "transparent",
          color: i === current ? "#0a1020" : "#94a3b8", fontWeight: i === current ? 600 : 400,
        }}>{p.label}</a>
      ))}
    </nav>
  );
}
function EdgeArrow({ page, side }) {
  return (
    <a href={page.href} className="edge-arrow" style={{
      position: "fixed", top: "50%", [side]: 14, transform: "translateY(-50%)", zIndex: 30,
      display: "flex", flexDirection: "column", alignItems: "center", gap: 6, textDecoration: "none",
      fontFamily: FONT, fontSize: 10, color: T.outline,
    }}>
      <span style={{ width: 46, height: 46, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                     fontSize: 22, border: `2px solid ${T.outline}`, background: "rgba(10,16,32,.85)" }}>{side === "left" ? "‹" : "›"}</span>
      <span>{page.label}</span>
    </a>
  );
}

  const last = Math.max(...SMALL.filter(e => MAG_SMALL[e.n]).map(e => scaledPos(MAG_SMALL[e.n])));
  let k = 0;
  SMALL.forEach(e => {
    e.mag = MAG_SMALL[e.n]; e.id = slug(e.n);
    if (e.mag) e.pos = scaledPos(e.mag); else { e.ord = true; e.pos = last + 40 + k * 35; k++; }
  });
}
ENTRIES.forEach(e => { e.mag = MAG[e.n]; });

// ── a list of cards for the current settings ────────────────────
const roundSig = (n, d) => +n.toPrecision(d);
function ratioText(d, sym) {
  const r = Math.pow(10, d);
  if (d >= 0.9 && Math.abs(d - Math.round(d)) < 0.015) { const k = Math.round(d); return sym + (k <= 9 ? Math.pow(10, k).toLocaleString("en-US") : "10" + supNum(k)); }
  if (r < 100) return sym + roundSig(r, 2);
  if (d < 6) return "about " + sym + roundSig(r, 2).toLocaleString("en-US");
  const e = Math.floor(d);
  return `about ${sym}${roundSig(Math.pow(10, d - e), 2)} × 10${supNum(e)}`;
}
function buildList(entries, chapters, egg, small) {
  const kept = entries.filter(e => egg || !e.egg).map((e, i) => ({ ...e, i }));
  kept.forEach((e, i) => {
    const p = kept[i - 1];
    e.jump = p && p.mag && e.mag && p.mag.lg !== undefined && e.mag.lg !== undefined && e.mag.lg <= 400 ? ratioText(e.mag.lg - p.mag.lg, small ? "÷" : "×") : e.j;
  });
  const chStart = chapters.map((_, c) => kept.findIndex(e => e.c === c));
  const chEnd = chapters.map((_, c) => kept.map(e => e.c).lastIndexOf(c));
  const lastScaled = Math.max(...kept.filter(e => !e.ord).map(e => e.pos));
  return { entries: kept, ch: chapters, chStart, chEnd, N: kept.length, lastScaled, small };
}

// ═══════════════════════════════════════════════════════════════
//  § 4  THE LINE
//  One row.  The view glides to each card: it zooms so the previous
//  and next numbers stay in sight, and the vertical line marks the
//  current one.  In "even" mode every number gets an equal step and
//  the whole list is shown, with the line moving instead.
//  L is the current list of cards: the big journey or the small one.
// ═══════════════════════════════════════════════════════════════
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const posOf = (e, even) => (even ? e.i : e.pos);
const SUPD = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const supNum = n => String(n).split("").map(d => SUPD[d]).join("");

function viewFor(i, even, L) {
  if (even) return { c: (L.N - 1) / 2, w: L.N / 2 + 1 };
  const e = L.entries[i];
  const a = i > 0 ? e.pos - L.entries[i - 1].pos : 0, b = i < L.N - 1 ? L.entries[i + 1].pos - e.pos : 0;
  return { c: e.pos, w: clamp(Math.max(a, b) * 2.4, 5, 700) };
}
function zoneCaption(c, even, L) {
  if (even) return "evenly spaced: one step per number, not to scale";
  if (L.small) {
    if (c <= 100.5) return "to scale: each step is ÷10 (one more zero after the point)";
    if (c <= P12) return "to scale: one over a tower; each level is one more “10 to the power of”";
    if (c <= L.lastScaled + 1) return "to scale: one over a tower, squeezed (logarithmic)";
    return "from here on, sizes cannot be compared: spaced by order only";
  }
  if (c <= 100.5) return "to scale: each step along the line is ×10 (one more digit)";
  if (c <= P12) return "to scale: each tower level is one more “10 to the power of”";
  if (c <= L.lastScaled + 1) return "to scale: the height of the tower, squeezed (logarithmic)";
  return "from here on, sizes cannot be compared: spaced by order only";
}

function SlideLine({ L, idx, even, onGo }) {
  const box = useRef(null), drag = useRef(null), curView = useRef(null), goal = useRef(null);
  goal.current = viewFor(idx, even, L);
  if (!curView.current) curView.current = goal.current;
  const [view, setView] = useState(curView.current);
  const [width, setWidth] = useState(800);
  const [hover, setHover] = useState(null);

  useEffect(() => {
    const ro = new ResizeObserver(([en]) => setWidth(en.contentRect.width));
    ro.observe(box.current);
    return () => ro.disconnect();
  }, []);

  // glide toward the goal view (position and zoom both ease in log space)
  useEffect(() => {
    let raf, last = performance.now();
    const step = now => {
      raf = requestAnimationFrame(step);
      const dt = Math.min(50, now - last); last = now;
      if (drag.current && drag.current.moved) return;
      const c = curView.current, g = goal.current, k = 1 - Math.exp(-dt / 140);
      const lw = Math.log(c.w) + (Math.log(g.w) - Math.log(c.w)) * k;
      const nc = c.c + (g.c - c.c) * k;
      const done = Math.abs(g.c - nc) < 1e-3 * g.w && Math.abs(lw - Math.log(g.w)) < 1e-3;
      const next = done ? g : { c: nc, w: Math.exp(lw) };
      if (next.c !== c.c || next.w !== c.w) { curView.current = next; setView(next); }
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, []);

  const X = p => 500 + ((p - view.c) / view.w) * 470;                 // viewBox x
  const pxPerUnit = (width / 1000) * 470 / view.w;
  const posAtClientX = cx => {
    const r = box.current.getBoundingClientRect();
    return view.c + (((cx - r.left) / r.width) * 1000 - 500) / 470 * view.w;
  };
  const nearest = p => {
    let best = 0, bd = Infinity;
    L.entries.forEach((e, i) => { const d = Math.abs(posOf(e, even) - p); if (d < bd) { bd = d; best = i; } });
    return best;
  };

  const down = ev => {
    box.current.setPointerCapture(ev.pointerId);
    drag.current = { x: ev.clientX, c: curView.current.c, w: curView.current.w, moved: false };
  };
  const move = ev => {
    const p = posAtClientX(ev.clientX);
    setHover(nearest(p));
    const d = drag.current;
    if (!d) return;
    if (!d.moved && Math.abs(ev.clientX - d.x) < 4) return;
    d.moved = true;
    if (even) { onGo(nearest(p)); return; }
    const ppu = (width / 1000) * 470 / d.w;
    const c = d.c - (ev.clientX - d.x) / ppu;
    curView.current = { c, w: d.w }; setView(curView.current);
    onGo(nearest(c));
  };
  const up = ev => {
    const d = drag.current; drag.current = null;
    if (d && !d.moved) {                                                   // a click: pick the nearest tick
      const i = nearest(posAtClientX(ev.clientX));
      if (Math.abs(X(posOf(L.entries[i], even)) - ((ev.clientX - box.current.getBoundingClientRect().left) / width) * 1000) < 22) onGo(i);
    }
  };

  // labels for the current number and its neighbours, kept from overlapping
  const labels = [];
  const taken = [];
  [0, -1, 1, -2, 2].forEach(off => {
    const i = idx + off;
    if (i < 0 || i >= L.N) return;
    const e = L.entries[i], px = (X(posOf(e, even)) / 1000) * width;
    if (px < 30 || px > width - 30) return;
    const text = e.n.length > 22 ? e.n.slice(0, 21) + "…" : e.n, w = text.length * 6.3 + 12;
    if (taken.some(([a, b]) => px - w / 2 < b && px + w / 2 > a)) return;
    taken.push([px - w / 2, px + w / 2]);
    labels.push({ i, px, text, on: off === 0 });
  });

  // axis: powers of ten in the first zone, tower levels in the second
  const axis = [];
  if (!even) {
    const lo = view.c - view.w, hi = view.c + view.w, neg = L.small ? "⁻" : "";
    if (lo < 100) {
      const raw = 56 / pxPerUnit, step = [1, 2, 5, 10, 20, 50].find(s => s >= raw) || 50;
      for (let k = Math.max(0, Math.ceil(lo / step) * step); k <= Math.min(100, hi); k += step) axis.push([k, k === 0 ? "1" : "10" + neg + supNum(k)]);
    }
    if (hi > P_TOWER && lo < P12) {
      for (let s = 3; s <= 12; s++) { const p = P_TOWER + (s - S_GOOGOL) * W_TOWER; if (p >= lo && p <= hi) axis.push([p, L.small ? `1/10↑↑${s}` : (s === 3 ? "10¹⁰¹⁰" : `10↑↑${s}`)]); }
    }
  }
  const cur = L.entries[idx];

  return (
    <div ref={box} style={{ position: "relative", height: 104, touchAction: "none", cursor: even ? "pointer" : "grab", userSelect: "none" }}
         onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={() => setHover(null)}>
      {even && L.ch.map((c, k) => {
        const x = (X((L.chStart[k] + L.chEnd[k]) / 2) / 1000) * width;
        return <div key={k} style={{ position: "absolute", top: 0, left: x, transform: "translateX(-50%)", fontSize: 10, whiteSpace: "nowrap",
                                     color: idx >= L.chStart[k] && idx <= L.chEnd[k] ? T.outline : "#4b5d73", pointerEvents: "none" }}>{width < 560 ? k + 1 : c.short}</div>;
      })}
      {labels.map(l => (
        <div key={l.i} style={{ position: "absolute", top: even ? 18 : 6, left: l.px, transform: "translateX(-50%)", fontSize: 11, whiteSpace: "nowrap",
                                color: l.on ? T.outline : "#6b7e96", fontWeight: l.on ? 600 : 400, pointerEvents: "none" }}>{l.text}</div>
      ))}
      <svg viewBox="0 0 1000 40" preserveAspectRatio="none" style={{ position: "absolute", left: 0, top: 38, width: "100%", height: 40 }}>
        {even && L.ch.map((c, k) => {
          const x0 = X(L.chStart[k] - 0.5), x1 = X(L.chEnd[k] + 0.5);
          return <rect key={k} x={x0} y={0} width={x1 - x0} height={40} fill={k % 2 ? "#0e1828" : "#101c30"} />;
        })}
        <line x1={0} x2={1000} y1={20} y2={20} stroke="#1e2d3d" vectorEffect="non-scaling-stroke" />
        {L.entries.map((e, i) => {
          const x = X(posOf(e, even));
          if (x < -10 || x > 1010) return null;
          return <line key={e.id} x1={x} x2={x} y1={even ? 15 : (i === idx ? 10 : 14)} y2={even ? 25 : (i === idx ? 30 : 26)} stroke={i <= idx ? "#4b6a94" : "#2b3d55"} vectorEffect="non-scaling-stroke" />;
        })}
        <line x1={X(posOf(cur, even))} x2={X(posOf(cur, even))} y1={2} y2={38} stroke={T.accent} strokeWidth={2} vectorEffect="non-scaling-stroke" />
      </svg>
      {axis.map(([p, text], k) => (
        <div key={k} style={{ position: "absolute", top: 80, left: `${X(p) / 10}%`, transform: "translateX(-50%)", fontSize: 9.5, color: "#4b5d73", whiteSpace: "nowrap", pointerEvents: "none" }}>{text}</div>
      ))}
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, textAlign: "center", fontSize: 10, color: "#4b5d73", pointerEvents: "none" }}>{zoneCaption(view.c, even, L)}</div>
      {hover !== null && hover !== idx && !drag.current && L.entries[hover] && (
        <div style={{ position: "absolute", top: 24, left: `${X(posOf(L.entries[hover], even)) / 10}%`, transform: "translate(-50%,-100%)",
                      background: "#0e1828", border: "1px solid #1e2d3d", borderRadius: 6, padding: "2px 8px", fontSize: 10, color: "#cbd5e1",
                      whiteSpace: "nowrap", pointerEvents: "none", zIndex: 5 }}>{L.entries[hover].n}</div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 5  SETTINGS  (bottom-right button: toggles and the wiki footer)
// ═══════════════════════════════════════════════════════════════
function Switch({ on, onClick, title, text }) {
  return (
    <button onClick={onClick} style={{ display: "flex", alignItems: "flex-start", gap: 10, width: "100%", background: "transparent", border: "none",
                                       color: "#cbd5e1", cursor: "pointer", textAlign: "left", padding: "8px 0", fontSize: 12, fontFamily: "inherit" }}>
      <span style={{ width: 30, height: 16, borderRadius: 8, position: "relative", flexShrink: 0, marginTop: 2, background: on ? T.cell : "#1e293b", transition: "background .2s" }}>
        <span style={{ position: "absolute", top: 2, left: on ? 16 : 2, width: 12, height: 12, borderRadius: "50%", background: "#fff", transition: "left .2s" }} />
      </span>
      <span>{title}<span style={{ display: "block", fontSize: 10, color: "#64748b", marginTop: 3, lineHeight: 1.5 }}>{text}</span></span>
    </button>
  );
}

function Settings({ open, setOpen, even, setEven, egg, setEgg, small, setSmall }) {
  return (
    <>
      {open && <div onClick={() => setOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 40 }} />}
      {open && (
        <div style={{ position: "fixed", right: 16, bottom: 72, zIndex: 50, width: "min(360px, calc(100vw - 32px))", maxHeight: "calc(100vh - 100px)", overflowY: "auto",
                      background: "#0e1828", border: `1px solid ${T.a(62, 0.25)}`, borderRadius: 14, padding: "12px 14px", boxShadow: "0 12px 40px rgba(0,0,0,.6)" }}>
          <div style={{ fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#4b5d73", marginBottom: 2 }}>Settings</div>
          <Switch on={even} onClick={() => setEven(!even)} title="Space the numbers evenly"
                  text="Off (default): the line is to scale, and slides to where each number really sits. On: every number gets an equal step." />
          <Switch on={egg} onClick={() => setEgg(!egg)} title="🥚 Hidden egg: numbers from around the world"
                  text="Adds the lakh, crore and other names used in India and Japan, and the long-scale meanings of billion and trillion." />
          <Switch on={small} onClick={() => setSmall(!small)} title="🔬 Look at small things"
                  text="Switches the journey to the numbers between 0 and 1: fractions, tenths, the tiniest things physics measures, and beyond." />
          <div style={{ borderTop: "1px solid #16233a", marginTop: 8, paddingTop: 10, fontSize: 10, color: "#64748b", lineHeight: 1.7 }}>
            <span style={{ display: "block", fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#4b5d73", marginBottom: 4 }}>About these numbers</span>
            Names, values and order follow the Googology Wiki’s “List of numbers”,
            {" "}<a href="https://googology.miraheze.org/wiki/List_of_numbers" target="_blank" rel="noopener" style={{ color: "#8aa0bd" }}>googology.miraheze.org/wiki/List_of_numbers</a>,
            a selection of the notable entries from a far longer list. The small numbers come from its smallest class, the numbers between 0 and 1.
            Definitions, dates and comparisons are checked against the outside sources listed on each card; basic numbers show none.
            Where I could only find a number on the wiki, the card says so. Names are conventions (“billion” and “trillion” differ between countries), and the wiki flags some entries as ill-defined.
            Comparisons use rounded, commonly cited estimates.
          </div>
        </div>
      )}
      <button className="btn" onClick={() => setOpen(!open)} title="Settings" style={{
        position: "fixed", right: 16, bottom: 16, zIndex: 60, width: 44, height: 44, borderRadius: "50%", fontSize: 19, padding: 0,
        background: open ? T.cell : "#0e1828", color: open ? "#fff" : T.outline, border: `1px solid ${T.a(62, 0.35)}`, boxShadow: "0 4px 18px rgba(0,0,0,.5)" }}>⚙</button>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 6  APP
// ═══════════════════════════════════════════════════════════════
const ONE_LINE = { display: "block", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" };
const findById = id => {
  const b = ENTRIES.find(e => e.id === id), s = SMALL.find(e => e.id === id);
  return b ? { small: false, egg: !!b.egg } : s ? { small: true, egg: false } : null;
};
const initial = () => {
  const id = location.hash.slice(1), hit = findById(id);
  return { id: hit ? id : ENTRIES[0].id, small: hit ? hit.small : false, egg: hit ? hit.egg : false };
};

function App() {
  const [init] = useState(initial);
  const [id, setId] = useState(init.id);
  const [small, setSmallState] = useState(init.small);
  const [egg, setEgg] = useState(init.egg);
  const [playing, setPlaying] = useState(false);
  const [open, setOpen] = useState(false);
  const [even, setEvenState] = useState(() => { try { return localStorage.getItem("nl-even") === "1"; } catch (_) { return false; } });
  const setEven = v => { setEvenState(v); try { localStorage.setItem("nl-even", v ? "1" : "0"); } catch (_) { /* private mode */ } };

  const L = useMemo(() => small ? buildList(SMALL, CH_SMALL, false, true) : buildList(ENTRIES, CH, egg, false), [small, egg]);
  const found = L.entries.findIndex(x => x.id === id);
  const idx = found >= 0 ? found : 0;
  const e = L.entries[idx], next = L.entries[idx + 1], ch = L.ch[e.c];
  const srcs = (SRC[e.n] || []).map(k => LINKS[k]);
  const steps = (DEF[e.n] || []).filter(st => egg || !st.startsWith("§egg:")).map(st => st.replace(/^§egg:/, ""));
  const basic = e.c === 0 && !e.egg;                                   // plain numbers need no sources

  const go = i => { setId(L.entries[clamp(i, 0, L.N - 1)].id); };
  const goStop = i => { setPlaying(false); go(i); };
  const prevChapter = () => goStop(idx > L.chStart[e.c] ? L.chStart[e.c] : Math.max(0, L.chStart[Math.max(0, e.c - 1)]));
  const nextChapter = () => goStop(e.c < L.ch.length - 1 ? L.chStart[e.c + 1] : L.N - 1);
  const setSmall = v => { setSmallState(v); setPlaying(false); setId(v ? SMALL[0].id : ENTRIES[0].id); };

  useEffect(() => { try { history.replaceState(null, "", "#" + e.id); } catch (_) { /* file:// */ } }, [e.id]);
  useEffect(() => {
    const onHash = () => { const h = findById(location.hash.slice(1)); if (!h) return; setSmallState(h.small); if (h.egg) setEgg(true); setId(location.hash.slice(1)); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setId(cur => {
      const i = L.entries.findIndex(x => x.id === cur);
      if (i >= L.N - 1) { setPlaying(false); return cur; }
      return L.entries[i + 1].id;
    }), 2800);
    return () => clearInterval(t);
  }, [playing, L]);
  useEffect(() => {
    const onKey = ev => {
      const tag = ev.target.tagName;
      if (ev.key === "ArrowRight") { ev.preventDefault(); ev.shiftKey ? nextChapter() : goStop(idx + 1); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); ev.shiftKey ? prevChapter() : goStop(idx - 1); }
      else if (ev.key === " " && tag !== "BUTTON" && tag !== "A") { ev.preventDefault(); goStop(idx + 1); }
      else if (ev.key === "Home") goStop(0);
      else if (ev.key === "End") goStop(L.N - 1);
      else if (ev.key === "p" || ev.key === "P") setPlaying(p => !p);
      else if (ev.key === "Escape") setOpen(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const len = e.v.replace(/[\^{}]/g, "").length;
  const fs = len <= 9 ? 52 : len <= 16 ? 40 : len <= 24 ? 30 : 24;
  const W = "min(880px,100%)";
  const label = { display: "block", fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: T.outline, marginBottom: 4 };

  return (
    <div style={{ minHeight: "100vh", background: "#0a1020", color: "#e2e8f0", fontFamily: FONT,
                  display: "flex", flexDirection: "column", alignItems: "center", padding: "16px 16px 84px" }}>
      <EdgeArrow page={PAGES[1]} side="left" />

      <div style={{ width: W, display: "flex", alignItems: "center", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
        <div style={{ flex: 1, minWidth: 180 }}>
          <div style={{ fontFamily: DISP, fontSize: "clamp(20px,3.6vw,28px)", color: T.outline }}>{small ? "The Number Line, Up Close" : "The Number Line"}</div>
          <div style={{ fontSize: 9, color: "#4b5d73", marginTop: 2, letterSpacing: "0.09em", textTransform: "uppercase" }}>
            {small ? "a walk from one down toward zero" : "a walk up the googology wiki’s list of numbers"}
          </div>
        </div>
        <PageSwitch current={2} />
      </div>

      {/* chapters */}
      <div className="chips" style={{ width: W, marginBottom: 6 }}>
        {L.ch.map((c, k) => (
          <button key={k} className="btn" onClick={() => goStop(L.chStart[k])} style={{
            whiteSpace: "nowrap", flexShrink: 0, background: k === e.c ? T.cell : "#0e1828", color: k === e.c ? "#fff" : "#94a3b8",
            borderColor: k === e.c ? T.outline : "#1e2d3d" }}>{k + 1} · {c.name}</button>
        ))}
      </div>

      {/* the line, then the controls: both keep a fixed size so nothing below them shifts the buttons */}
      <div style={{ width: W }}><SlideLine key={small ? "small" : "big"} L={L} idx={idx} even={even} onGo={goStop} /></div>

      <div style={{ width: W, display: "flex", gap: 6, height: 52, margin: "4px 0 12px" }}>
        <button className="btn" onClick={prevChapter} disabled={idx === 0} title="skip back a chapter" style={{ width: 46 }}>⟪ …</button>
        <button className="btn" onClick={() => goStop(idx - 1)} disabled={idx === 0} title="previous number" style={{ width: 40, fontSize: 16 }}>‹</button>
        {next ? (
          <a className="next" href={"#" + next.id} onClick={ev => { ev.preventDefault(); goStop(idx + 1); }}
             style={{ flex: 1, minWidth: 0, height: 52, padding: "0 14px", background: T.a(40, 0.2), border: `1px solid ${T.a(62, 0.35)}`, color: "#e2e8f0" }}>
            <span style={{ flex: 1, minWidth: 0 }}>
              <span style={{ ...ONE_LINE, fontSize: 9, letterSpacing: "0.12em", textTransform: "uppercase", color: "#64748b" }}>
                next{next.c !== e.c ? ` · chapter ${next.c + 1}` : ""}
              </span>
              <span style={{ ...ONE_LINE, fontSize: 13, color: T.outline, marginTop: 2 }}>
                {next.n}<span style={{ color: "#94a3b8" }}>{next.jump ? ` · ${next.jump}` : ""}</span>
              </span>
            </span>
            <span style={{ fontSize: 22, color: T.outline }}>→</span>
          </a>
        ) : (
          <a className="next" href={"#" + L.entries[0].id} onClick={ev => { ev.preventDefault(); goStop(0); }}
             style={{ flex: 1, minWidth: 0, height: 52, padding: "0 14px", background: T.a(40, 0.2), border: `1px solid ${T.a(62, 0.35)}`, color: T.outline, justifyContent: "space-between" }}>
            <span style={{ ...ONE_LINE, fontSize: 13 }}>End of the list. Start again from {L.entries[0].n}</span><span style={{ fontSize: 20 }}>↺</span>
          </a>
        )}
        <button className="btn" onClick={() => setPlaying(p => !p)} title="play the journey (P)" style={{ width: 40, color: playing ? "#fff" : "#94a3b8", background: playing ? T.cell : "#0e1828" }}>{playing ? "❚❚" : "▶"}</button>
        <button className="btn" onClick={nextChapter} disabled={idx === L.N - 1} title="skip ahead a chapter" style={{ width: 46 }}>… ⟫</button>
      </div>

      {/* the card */}
      <div key={e.id} className="flip" style={{ width: W, background: "#0e1828", border: "1px solid #16233a", borderRadius: 16, padding: "18px 20px 16px" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", fontSize: 10, color: "#64748b", marginBottom: 6 }}>
          <span style={{ color: T.outline }}>{ch.name}</span><span>·</span><span>{idx + 1} of {L.N}</span>
          {e.egg && <><span>·</span><span style={{ color: "#c08a4a" }}>🥚 hidden egg</span></>}
          {e.x && <><span>·</span><span style={{ color: "#c08a4a" }}>{e.x}</span></>}
          {e.ord && !even && <><span>·</span><span style={{ color: "#c08a4a" }}>placed by order only</span></>}
        </div>
        {e.v !== e.n && <div style={{ fontFamily: DISP, fontSize: 20, color: T.outline }}>{e.n}</div>}
        <div style={{ fontFamily: DISP, fontSize: fs, color: e.v === e.n ? T.outline : "#f1f5f9", margin: "4px 0 2px", lineHeight: 1.15, overflowWrap: "anywhere" }}><Val s={e.v} /></div>
        {e.a && <div style={{ fontSize: 13, color: "#94a3b8", marginBottom: 2 }}><Val s={e.a} /></div>}
        <div style={{ fontSize: 12.5, color: "#a5b4c8", lineHeight: 1.65, marginTop: 10, maxWidth: 680 }}><Val s={e.t} /></div>
        {egg && e.eg && <div style={{ fontSize: 12, color: "#c9a56a", lineHeight: 1.6, marginTop: 8, maxWidth: 680 }}>🥚 <Val s={e.eg} /></div>}

        {steps.length > 0 && (
          <div style={{ marginTop: 14, maxWidth: 680 }}>
            <span style={label}>how it is defined</span>
            <ol style={{ margin: 0, paddingLeft: 20, fontSize: 12, color: "#b6c3d4", lineHeight: 1.7 }}>
              {steps.map((st, k) => <li key={k} style={{ marginBottom: 3 }}><Val s={st} /></li>)}
            </ol>
          </div>
        )}
        {e.s && (
          <div style={{ marginTop: 14, padding: "8px 12px", borderLeft: `2px solid ${T.outline}`, background: T.a(40, 0.12), borderRadius: "0 8px 8px 0", maxWidth: 680 }}>
            <span style={{ ...label, marginBottom: 2 }}>to get a feel for it</span>
            <span style={{ fontSize: 12.5, color: "#cbd5e1", lineHeight: 1.6 }}>{e.s}</span>
          </div>
        )}
        {e.l && <a href={e.l[0]} style={{ display: "inline-block", marginTop: 12, fontSize: 11, color: T.outline, textDecoration: "none", border: `1px solid ${T.a(62, 0.3)}`, borderRadius: 8, padding: "4px 10px" }}>▦ {e.l[1]} →</a>}

        {!basic && (
          <div style={{ marginTop: 14, fontSize: 10.5, color: "#64748b", lineHeight: 1.8 }}>
            <span style={{ ...label, color: "#4b5d73", marginBottom: 2 }}>sources</span>
            {srcs.map(([text, url], k) => (
              <span key={k}>{k > 0 && " · "}<a href={url} target="_blank" rel="noopener" style={{ color: "#8aa0bd" }}>{text}</a></span>
            ))}
            {srcs.length > 0 && " · "}
            <a href={LINKS.wiki[1]} target="_blank" rel="noopener" style={{ color: "#8aa0bd" }}>{LINKS.wiki[0]}</a>
            {srcs.length === 0 && <span style={{ display: "block", color: "#7d6a4a" }}>Only the Googology Wiki lists this one; I found no independent source.</span>}
          </div>
        )}
      </div>

      <div style={{ width: W, marginTop: 8, fontSize: 10, color: "#4b5d73", lineHeight: 1.7 }}>
        {ch.blurb} Drag the line, press → or Space for the next number, Shift + → for the next chapter, P to play.
      </div>

      <Settings open={open} setOpen={setOpen} even={even} setEven={setEven} egg={egg} setEgg={setEgg} small={small} setSmall={setSmall} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
