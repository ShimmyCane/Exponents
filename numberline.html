<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Number Line</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #0a1020; }
    * { box-sizing: border-box; }
    .track { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #1e2d3d transparent; }
    .tick { cursor: pointer; }
    .tick:hover text { fill: #e2e8f0; }
    .btn { cursor: pointer; border: none; font-family: 'DM Mono', monospace; font-size: 11px; color: #cbd5e1;
           background: #1e293b; border-radius: 6px; padding: 4px 10px; }
    .btn:hover:not(:disabled) { filter: brightness(1.25); }
    .btn:disabled { opacity: .35; cursor: default; }
    .flip { animation: flip .4s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes flip { from { opacity: 0; transform: perspective(600px) rotateX(-12deg) translateY(4px); } to { opacity: 1; transform: none; } }
    .edge-arrow:hover { filter: brightness(1.35); }
    @media (max-width: 1060px) { .edge-arrow { display: none !important; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
//  § 1  CONFIG
// ═══════════════════════════════════════════════════════════════
const CFG = {
  PX: 240,              // pixels per unit of super-log (one level of "10 to the power of")
  PAD: 90,              // space left of the start of the line
  SMAX: 9,              // right end of the line, in super-log units
};
const FONT = "'DM Mono', monospace";
const DISP = "'DM Serif Display', serif";
const HUE = 213;
const theme = {
  accent: `hsl(${HUE},75%,62%)`, outline: `hsl(${HUE},80%,72%)`, cell: `hsl(${HUE},65%,48%)`,
  a: (l, a) => `hsla(${HUE},75%,${l}%,${a})`,
};

// ═══════════════════════════════════════════════════════════════
//  § 2  NUMBERS
//
//  A value is {h, v}: h tens stacked over v, i.e. 10^10^…^v with h tens
//  (h = 0 is just v itself).  The super-log s(x) counts how many times
//  you can take log10 before x drops below 10 — so each whole step on the
//  line is exactly one more "10 to the power of".  That is the scale.
// ═══════════════════════════════════════════════════════════════
const slPlain = x => x < 10 ? Math.log10(Math.max(1, x)) : 1 + slPlain(Math.log10(x));
const sOf = r => r.h + slPlain(r.v);
const xOf = s => CFG.PAD + s * CFG.PX;

function norm({ h, v }) {
  while (h > 0 && v < 15) { v = Math.pow(10, v); h--; }
  while (v >= 1e15) { v = Math.log10(v); h++; }
  return { h, v };
}
function up(r) {                    // 10^x : one more tens tower level
  if (r.h >= 1) return { h: r.h + 1, v: r.v };
  return { h: 1, v: Math.log10(r.v) };
}
function down(r) {                  // log10 x : one fewer level (only when it stays exact enough)
  if (r.h >= 2) return { h: r.h - 1, v: r.v };
  if (r.h === 1 && r.v < 300) return { h: 0, v: Math.pow(10, r.v) };
  if (r.h === 0 && r.v > 10) return { h: 0, v: Math.log10(r.v) };
  return null;
}

const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const sup = n => String(n).split("").map(d => SUP[d]).join("");
const fmt = v => v.toLocaleString("en-US");
function readable(r) {
  if (r.h === 0) {
    if (r.v < 1e6) return fmt(r.v);
    const e = Math.floor(Math.log10(r.v));
    return `${(r.v / Math.pow(10, e)).toFixed(2)} × 10${sup(e)}`;
  }
  if (r.h <= 3) {
    let inner = `${Number.isInteger(r.v) ? fmt(r.v) : r.v.toPrecision(3)}`;
    for (let i = 0; i < r.h; i++) inner = `10^(${inner})`;
    return inner;
  }
  return `10↑↑${r.h} (${r.h} tens, top ${r.v})`;
}
function digitsOf(r) {
  if (r.h === 0) return r.v < 1e15 ? fmt(Math.floor(Math.log10(r.v)) + 1) : null;
  if (r.h === 1) return fmt(Math.floor(r.v) + 1);
  return null;
}

// ═══════════════════════════════════════════════════════════════
//  § 3  POINTS ON THE LINE
//
//  Source: the uploaded copy of the Googology Wiki "List of numbers"
//  (marked "wiki") or a standard reference (marked "std").
// ═══════════════════════════════════════════════════════════════
const POINTS = [
  { name: "One",                 r: { h: 0, v: 1 },       src: "wiki", note: "The starting line. Every number on this page is one more “10 to the power of” than the one before it." },
  { name: "Ten",                 r: { h: 0, v: 10 },      src: "wiki", note: "The base of our counting system: ten fingers, ten symbols, and the first power of ten." },
  { name: "Thousand",            r: { h: 0, v: 1e3 },     src: "wiki", note: "1,000. Above it, the short scale names each power of a thousand: million, billion, trillion, and so on." },
  { name: "Million",             r: { h: 0, v: 1e6 },     src: "wiki", note: "The first name that really feels big. It is 1,000 thousands." },
  { name: "Billion",             r: { h: 0, v: 1e9 },     src: "wiki", note: "10⁹ in the short scale. Older British usage (the long scale) used a billion for 10¹² — a reminder that names are conventions." },
  { name: "Trillion",            r: { h: 0, v: 1e12 },    src: "wiki", note: "10¹². A trillion seconds is about 31,700 years." },
  { name: "Quadrillion",         r: { h: 0, v: 1e15 },    src: "wiki", note: "10¹⁵. A quadrillion seconds is about 31.7 million years." },
  { name: "Quintillion",         r: { h: 0, v: 1e18 },    src: "wiki", note: "10¹⁸. Grains of sand on all of Earth's beaches are in this range." },
  { name: "Decillion",           r: { h: 0, v: 1e33 },    src: "wiki", note: "10³³. The short scale keeps going this way, one ‘-illion’ per thousand, all the way to centillion (10³⁰³)." },
  { name: "Avogadro's number",   r: { h: 0, v: 6.022e23 }, src: "wiki", note: "Particles in one mole: the number of atoms in 12 g of carbon-12. It is a counting number that chemists actually use." },
  { name: "Eddington's number",  r: { h: 0, v: 1.5748e79 }, src: "wiki", note: "Arthur Eddington's 1938 estimate of the protons in the observable universe (about 136 · 2²⁵⁶)." },
  { name: "Googol",              r: { h: 1, v: 100 },     src: "wiki", note: "1 followed by 100 zeros. Coined in 1938 by Milton Sirotta, aged nine, and named by his uncle, the mathematician Edward Kasner." },
  { name: "Centillion (short)",  r: { h: 0, v: 1e303 },   src: "wiki", note: "10³⁰³ in the short scale. The googol (10¹⁰⁰) sits well below it, between decillion and centillion." },
  { name: "Planck volumes",      r: { h: 0, v: 4.6e185 }, src: "wiki", note: "About 4.6 × 10¹⁸⁵ Planck volumes fit in the observable universe. A Planck volume is the smallest volume with meaning in current physics." },
  { name: "Googolplex",          r: { h: 2, v: 100 },     src: "wiki",  note: "10 raised to a googol. It has more digits than there are atoms in the observable universe, so you cannot write it out." },
  { name: "First Skewes number", r: { h: 3, v: 34 },      src: "wiki",  note: "Skewes (1933) gave an upper bound for the first number x where the prime count π(x) overtakes the logarithmic integral li(x). It was the largest number ever used in a serious proof for many decades." },
  { name: "Second Skewes number", r: { h: 3, v: 963 },  src: "wiki", note: "The wiki gives its value as 10^10^10^963. It is the bound used in the same prime-counting proof, and it is far larger than the first." },
  { name: "Googolplexian",       r: { h: 3, v: 100 },     src: "std",  note: "10 raised to a googolplex: the next rung of the same ladder." },
];
// Numbers that grow faster than any tower on this line: they sit past its right end.
const BEYOND = [
  { name: "Graham's number", src: "wiki", note: "G₆₄, from Graham and Rothschild's Ramsey problem (1971). Each step uses one more layer of up-arrows, so no finite power tower can hold it." },
  { name: "Moser's number",  src: "wiki", note: "2[2[5]] in Steinhaus–Moser notation, about 3 ↑ Mega 3. Mega is itself a polygon-notation number, so this sits far past any tower." },
  { name: "xkcd number",     src: "wiki", note: "A(G, G), where G is Graham's number. Named after the xkcd comic that introduced it, and far past Graham's number." },
  { name: "TREE(3)",         src: "wiki", note: "From Kruskal's tree theorem: the longest possible sequence of labelled trees. The wiki gives only lower bounds for it, and it is far larger than Graham's number." },
  { name: "SSCG(3)",         src: "wiki", note: "From Friedman's subcubic graph problem (SSCG): the longest sequence of subcubic graphs that obeys a rule. It is far larger than TREE(3)." },
  { name: "Rayo's number",   src: "wiki", note: "Rayo(10¹⁰⁰): the smallest number bigger than any number nameable by a first-order set-theory sentence of a googol symbols." },
];
const SORTED = POINTS.map(p => ({ ...p, s: sOf(p.r) })).sort((a, b) => a.s - b.s);

const ZONES = [
  { from: 0, to: 1, label: "counting and names" },
  { from: 1, to: 2, label: "thousands, millions, billions" },
  { from: 2, to: 3, label: "googol, and the names beyond it" },
  { from: 3, to: 4, label: "googolplex: a power of a power" },
  { from: 4, to: 9, label: "towers of tens" },
];

// ═══════════════════════════════════════════════════════════════
//  § 4  NAV (same series as the other pages)
// ═══════════════════════════════════════════════════════════════
const SERIES = [
  { href: "index.html",   label: "Exponents",   tag: "bⁿ" },
  { href: "uparrow.html", label: "Up-arrows",   tag: "a↑↑n" },
  { href: null,           label: "Number line", tag: "you are here" },
];
function EdgeArrows({ current }) {
  const arrow = (p, side) => {
    if (!p) return null;
    const st = {
      position: "fixed", top: "50%", [side]: 14, transform: "translateY(-50%)", zIndex: 30,
      display: "flex", flexDirection: "column", alignItems: "center", gap: 6, textDecoration: "none",
      fontFamily: FONT, fontSize: 10, color: p.href ? theme.outline : "#4b5d73", opacity: p.href ? 1 : 0.6,
    };
    const circle = (
      <span style={{
        width: 46, height: 46, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 22, border: `2px solid ${p.href ? theme.outline : "#1e2d3d"}`, background: "rgba(10,16,32,.85)",
      }}>{side === "left" ? "‹" : "›"}</span>
    );
    const text = <span style={{ textAlign: "center", lineHeight: 1.3 }}>{p.label}<br /><span style={{ opacity: 0.6 }}>{p.tag}</span></span>;
    return p.href
      ? <a key={side} href={p.href} className="edge-arrow" style={st}>{circle}{text}</a>
      : <span key={side} className="edge-arrow" style={st}>{circle}{text}</span>;
  };
  return <>{arrow(SERIES[current - 1], "left")}{arrow(SERIES[current + 1], "right")}</>;
}

// ═══════════════════════════════════════════════════════════════
//  § 5  PAGE SWITCH  (same control on all three pages)
// ═══════════════════════════════════════════════════════════════
const PAGES = [
  { href: "index.html", label: "Exponents" },
  { href: "uparrow.html", label: "Up-arrows" },
  { href: "numberline.html", label: "Number line" },
];
function PageSwitch({ current, color, line }) {
  return (
    <nav style={{ display: "inline-flex", border: `1px solid ${line}`, borderRadius: 8, overflow: "hidden", fontFamily: FONT, fontSize: 11, flexShrink: 0 }}>
      {PAGES.map((p, i) => (
        <a key={p.href} href={p.href} style={{
          padding: "5px 10px", textDecoration: "none", whiteSpace: "nowrap",
          background: i === current ? color : "transparent",
          color: i === current ? "#0a1020" : "#94a3b8", fontWeight: i === current ? 600 : 400,
        }}>{p.label}</a>
      ))}
    </nav>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 6  THE LINE
//  The line always runs past the current value, so it never ends.
// ═══════════════════════════════════════════════════════════════
const LINE = 112;                                   // y of the line itself
const lineEnd = curS => Math.max(CFG.SMAX, Math.ceil(curS) + 4);
const tickLabel = t => t === 0 ? "1" : t === 1 ? "10" : t === 2 ? "10¹⁰" : t === 3 ? "10¹⁰¹⁰" : `10↑↑${t}`;

function Line({ curS, selected, onPick }) {
  const end = lineEnd(curS), W = CFG.PAD * 2 + end * CFG.PX;
  const step = Math.max(1, Math.ceil(end / 14));    // label every nth level on very long lines
  const rows = [];
  const tiers = SORTED.map(p => {                    // stack names so none overlap
    const w = (p.name.length + (p.src === "std" ? 2 : 0)) * 6.2 + 6, x = xOf(p.s);
    let k = rows.findIndex(r => r.every(([a, b]) => x + w / 2 < a || x - w / 2 > b));
    if (k < 0) { rows.push([]); k = rows.length - 1; }
    rows[k].push([x - w / 2, x + w / 2]);
    return k;
  });
  const rowY = k => LINE - 22 - k * 13;
  const ticks = Array.from({ length: Math.floor(end / step) + 1 }, (_, i) => i * step);
  return (
    <svg width={W} height={LINE + 36} style={{ display: "block" }}>
      <line x1={xOf(0)} x2={xOf(end)} y1={LINE} y2={LINE} stroke="#1e2d3d" />
      {ticks.map(t => (
        <g key={t}>
          <line x1={xOf(t)} x2={xOf(t)} y1={LINE - 4} y2={LINE + 4} stroke="#33475e" />
          <text x={xOf(t)} y={LINE + 16} textAnchor="middle" fill="#4b5d73" fontSize={9.5} fontFamily={FONT}>{tickLabel(t)}</text>
        </g>
      ))}
      {SORTED.map((p, i) => {
        const x = xOf(p.s), y = rowY(tiers[i]), on = selected === p.name;
        return (
          <g key={p.name} className="tick" onClick={() => onPick(p.name)}>
            <line x1={x} x2={x} y1={y + 3} y2={LINE} stroke={on ? theme.outline : "#22324a"} />
            <circle cx={x} cy={LINE} r={on ? 3 : 2} fill={on ? theme.outline : "#64748b"} />
            <text x={x} y={y} textAnchor="middle" fill={on ? theme.outline : "#64748b"} fontSize={10.5} fontFamily={FONT}>
              {p.name}{p.src === "std" ? " †" : ""}
            </text>
          </g>
        );
      })}
      {/* the current value: a single vertical line */}
      <line x1={xOf(curS)} x2={xOf(curS)} y1={6} y2={LINE + 4} stroke={theme.accent} strokeWidth={1.5} />
    </svg>
  );
}

// Towers of up to three tens as nested superscripts; everything else as text.
function ValueView({ r }) {
  if (r.h === 0 || r.h > 3) return <span>{readable(r)}</span>;
  let inner = <span>{Number.isInteger(r.v) ? fmt(r.v) : r.v.toPrecision(3)}</span>;
  for (let i = 0; i < r.h; i++) inner = <span>10<sup style={{ fontSize: "0.55em" }}>{inner}</sup></span>;
  return inner;
}

// ═══════════════════════════════════════════════════════════════
//  § 7  APP
//  One sequence of steps: the named points, then the numbers beyond the
//  line.  The card flips as the number moves through it.
// ═══════════════════════════════════════════════════════════════
const STEPS = [
  ...SORTED.map(p => ({ kind: "point", name: p.name, p })),
  ...BEYOND.map(b => ({ kind: "beyond", name: b.name, b })),
];
// index of the last named point at or below a super-log value
function indexFor(s) {
  let k = 0;
  SORTED.forEach((p, i) => { if (p.s <= s + 1e-9) k = i; });
  return k;
}

function App() {
  const [cur, setCur] = useState({ h: 0, v: 1 });
  const [pos, setPos] = useState(0);
  const scroller = useRef(null);
  const curS = sOf(cur);
  const step = STEPS[pos];
  const zone = ZONES.find(z => curS >= z.from && curS < z.to) ?? ZONES[ZONES.length - 1];
  const digits = digitsOf(cur);
  const canDown = down(cur) !== null;

  // keep the current value centred as it grows
  useEffect(() => {
    const el = scroller.current;
    if (el) el.scrollTo({ left: xOf(curS) - el.clientWidth / 2, behavior: "smooth" });
  }, [curS]);

  function go(i) {                       // move to a step in the sequence
    const j = Math.max(0, Math.min(STEPS.length - 1, i));
    setPos(j);
    if (STEPS[j].kind === "point") setCur(STEPS[j].p.r);
  }
  function climb(next) {                 // change the number itself; the card follows
    setCur(next);
    setPos(indexFor(sOf(next)));
  }
  useEffect(() => {
    const onKey = e => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") go(pos + 1);
      if (e.key === "ArrowLeft") go(pos - 1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  return (
    <div style={{ minHeight: "100vh", background: "#0a1020", color: "#e2e8f0", fontFamily: FONT,
                  display: "flex", flexDirection: "column", alignItems: "center", padding: "16px 16px 32px" }}>
      <EdgeArrows current={2} />

      {/* header */}
      <div style={{ width: "min(960px,100%)", display: "flex", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <div style={{ flex: 1, minWidth: 180 }}>
          <div style={{ fontFamily: DISP, fontSize: "clamp(20px,3.6vw,28px)", color: theme.outline }}>The Number Line</div>
          <div style={{ fontSize: 9, color: "#4b5d73", marginTop: 2, letterSpacing: "0.09em", textTransform: "uppercase" }}>
            every tick is one more “10 to the power of”
          </div>
        </div>
        <PageSwitch current={2} color={theme.outline} line={theme.a(62, 0.3)} />
      </div>

      {/* readout */}
      <div style={{ width: "min(960px,100%)", display: "flex", alignItems: "center", justifyContent: "center", gap: 14, padding: "8px 0 4px" }}>
        <button className="btn" onClick={() => climb(down(cur))} disabled={!canDown} title="take the log (one level down)"
          style={{ width: 30, height: 30, borderRadius: "50%", fontSize: 14, padding: 0 }}>↓</button>
        <div style={{ fontFamily: DISP, fontSize: "clamp(20px,3.4vw,30px)", color: "#f1f5f9", textAlign: "center", minWidth: 220 }}>
          <ValueView r={cur} />
        </div>
        <button className="btn" onClick={() => climb(up(cur))} title="10 to the power of this (one level up)"
          style={{ width: 30, height: 30, borderRadius: "50%", fontSize: 14, padding: 0 }}>↑</button>
      </div>
      <div style={{ fontSize: 10, color: "#64748b", marginBottom: 10, textAlign: "center" }}>
        {digits ? `${digits} digit${digits === "1" ? "" : "s"} · ` : "more digits than atoms in the universe · "}
        super-log {curS.toFixed(2)} · {zone.label}
      </div>

      {/* line */}
      <div style={{ width: "min(960px,100%)", background: "#0e1828", borderRadius: 12, padding: "8px 0 6px", border: "1px solid #16233a" }}>
        <div ref={scroller} className="track">
          <Line curS={curS} selected={step.kind === "point" ? step.name : null}
                onPick={name => go(SORTED.findIndex(p => p.name === name))} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 12px 0", fontSize: 10, color: "#4b5d73" }}>
          <button className="btn" onClick={() => go(pos - 1)} disabled={pos === 0}>← previous</button>
          <button className="btn" onClick={() => go(pos + 1)} disabled={pos === STEPS.length - 1}>next →</button>
          <span style={{ marginLeft: "auto" }}>scroll sideways · ← → keys</span>
        </div>
      </div>

      {/* flipping card */}
      <div key={pos} className="flip" style={{ width: "min(960px,100%)", marginTop: 12, background: "#0e1828", borderRadius: 12, padding: "12px 16px", border: "1px solid #16233a", minHeight: 78 }}>
        <div style={{ fontFamily: DISP, fontSize: 18, color: theme.outline }}>
          {step.name}{step.kind === "point" && step.p.src === "std" ? " †" : ""}
        </div>
        <div style={{ fontSize: 12, color: "#a5b4c8", lineHeight: 1.6, marginTop: 4 }}>
          {step.kind === "point" ? step.p.note : step.b.note}
        </div>
        {step.kind === "beyond" && <div style={{ fontSize: 10, color: "#4b5d73", marginTop: 6 }}>beyond the right edge of the line</div>}
      </div>

      {/* footnotes */}
      <div style={{ width: "min(960px,100%)", marginTop: 14, fontSize: 10, color: "#4b5d73", lineHeight: 1.7 }}>
        <div>
          ¹ Names and values come from the Googology Wiki’s “List of numbers”,
          {" "}<a href="https://googology.miraheze.org/wiki/List_of_numbers" target="_blank" rel="noopener" style={{ color: "#64748b" }}>googology.miraheze.org/wiki/List_of_numbers</a>.
          Names are conventions: “billion” and “trillion” differ between countries.
        </div>
        <div>† Googolplexian is a standard reference that the wiki copy does not confirm.</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
