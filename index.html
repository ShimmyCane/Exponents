<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exponent Visualizer</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #0a1020; }
    * { box-sizing: border-box; }
    .bt { cursor: pointer; border: none; transition: all .18s; }
    .bt:hover { filter: brightness(1.25); }
    .nav-btn:hover:not(:disabled) { filter: brightness(1.3); transform: scale(1.08); }
    .nav-btn:active:not(:disabled) { transform: scale(0.92); }
    .tool { cursor: pointer; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 11px;
            height: 30px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
            background: rgba(10,16,32,.78); backdrop-filter: blur(4px); transition: filter .15s; }
    .tool:hover { filter: brightness(1.35); }
    .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
                 border-radius: 8px; text-decoration: none; font-family: 'DM Mono', monospace; font-size: 12px;
                 background: transparent; border: none; cursor: pointer; text-align: left; }
    .menu-item:hover:not(.off) { background: rgba(255,255,255,.05); }
    .menu-item.off { cursor: default; opacity: .45; }
    input[type=range].exp { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; outline: none; }
    input[type=range].exp::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: var(--thumb); border: 2px solid var(--thumb-edge); cursor: pointer; box-shadow: 0 0 8px var(--thumb); }
    input[type=range].exp::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%;
      background: var(--thumb); border: 2px solid var(--thumb-edge); cursor: pointer; }
    .series:hover { filter: brightness(1.3); }
    .edge-arrow:hover { filter: brightness(1.35); }
    @media (max-width: 1060px) { .edge-arrow { display: none !important; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ═══════════════════════════════════════════════════════════════
//  § 1  CONFIG
// ═══════════════════════════════════════════════════════════════
const CFG = {
  BASE_MIN:  2,
  BASE_MAX:  10,
  BASE_INIT: 2,
  EXP_INIT:  3,
  EXP_CAP:   40,   // hard ceiling on the exponent slider
  MAX_DIGITS: 15,  // keep bⁿ ≤ 10¹⁵ so every cell index is an exact double

  // Full single-step durations (ms).  Intermediate steps of a multi-step
  // jump replay the same animation, compressed (see Field.startStep).
  T_UP: 2300,
  T_DN: 1900,
  UP_SPLIT: [0.56, 0.80],   // copy │ merge │ settle
  DN_SPLIT: [0.28, 0.82],   // mark │ fold  │ settle
  FAST_MIN: 0.035,          // shortest intermediate step, as a fraction of full

  CAM_TAU:      160,        // camera smoothing time-constant (ms)
  CAM_TAU_FAST: 70,
  FIT_PAD:      0.11,       // fraction of the panel kept clear around the blob
  ZOOM_IN_MAX:  4000,       // px per cell
  NUM_MIN_PX:   46,         // cell size at which cell numbers fade in

  BASE_HUES: [0, 0, 213, 159, 265, 25, 340, 50, 185, 300],
};
const expMax = b => Math.min(CFG.EXP_CAP, Math.floor(CFG.MAX_DIGITS / Math.log10(b) + 1e-9));

const FONT   = "'DM Mono', monospace";
const DISP   = "'DM Serif Display', serif";
const CVFONT = '"DM Mono", monospace';

// ═══════════════════════════════════════════════════════════════
//  § 2  COLOR + THEME
// ═══════════════════════════════════════════════════════════════
function hslRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix  = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function makeTheme(base) {
  const hue = CFG.BASE_HUES[base] ?? (base * 37) % 360;
  const c = (s, l, dh = 0) => hslRgb(hue + dh, s, l);
  const rgb = {
    accent:  c(75, 62),
    bg:      c(40, 5),
    cell:    c(65, 48),
    outline: c(80, 72),
    fresh:   c(85, 68, 32),   // newly made copies, before they fuse
    gone:    c(15, 22),       // strips about to be folded away
  };
  return {
    hue, rgb,
    accent: rgba(rgb.accent), bg: rgba(rgb.bg), cell: rgba(rgb.cell), outline: rgba(rgb.outline),
    a: (name, alpha) => rgba(rgb[name], alpha),
    // Generation k = the cells added by step k.  Hue wobbles around the base hue.
    gen: k => k === 0 ? rgb.outline : c(62, k % 2 ? 42 : 54, ((k * 37) % 120) - 60),
  };
}

// ═══════════════════════════════════════════════════════════════
//  § 3  GEOMETRY + FORMATTING
//
//  Stage k is a w×h block of bᵏ unit cells, anchored at the origin.
//  Step k multiplies the width (odd k) or the height (even k) by b, so
//  stage k = b copies of stage k−1 laid side by side.  Copy 0 is always
//  the previous stage itself, which is why every earlier stage is nested
//  in the top-left corner and the seed cell sits at (0,0).
// ═══════════════════════════════════════════════════════════════
const dims    = (b, k) => ({ w: Math.pow(b, Math.ceil(k / 2)), h: Math.pow(b, Math.floor(k / 2)) });
const growsX  = k => k % 2 === 1;

// Position of cell (x,y) in growth order: digit ℓ (base b) says which copy
// the cell sits in at step ℓ.
function cellIndex(b, x, y, n) {
  let idx = 0, sx = 1, sy = 1, pw = 1;
  for (let l = 1; l <= n; l++) {
    let d;
    if (growsX(l)) { d = Math.floor(x / sx) % b; sx *= b; }
    else           { d = Math.floor(y / sy) % b; sy *= b; }
    idx += d * pw; pw *= b;
  }
  return idx;
}

const clamp01 = x => Math.max(0, Math.min(1, x));
const seg     = (p, a, b) => clamp01((p - a) / (b - a));
const smooth  = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const EASE = {
  inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out:   t => 1 - Math.pow(1 - t, 3),
};

const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const SUB = "₀₁₂₃₄₅₆₇₈₉";
const sup = n => String(n).split("").map(d => SUP[d]).join("");
const sub = n => String(n).split("").map(d => SUB[d]).join("");
const fmt = v => v.toLocaleString("en-US");
const NAMES = [[1e15, "quadrillion"], [1e12, "trillion"], [1e9, "billion"], [1e6, "million"]];
function named(v) {
  for (const [t, nm] of NAMES) if (v >= t) return `${+(v / t).toPrecision(3)} ${nm}`;
  return null;
}
function sci(v) {
  let e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
  if (m >= 9.995) { m /= 10; e += 1; }
  return `${m.toFixed(2)} × 10${sup(e)}`;
}

// ═══════════════════════════════════════════════════════════════
//  § 4  FIELD ENGINE  (canvas, camera, animation timeline)
//
//  The whole picture lives in world units (1 unit = 1 cell).  The camera
//  is {x, y, s}: world point at the panel centre and pixels per cell.
//  Rendering is level-of-detail: blocks are filled as single rects and
//  the cell / block seams are drawn as lines only where they are visible
//  and at least a few pixels apart, so 10¹⁵ cells cost the same as 8.
//
//  Animation:  one step at a time, driven by requestAnimationFrame.
//    UP   m→k   copy:   b−1 copies unfold out of the block like an accordion
//                       while the camera pulls back to make room
//               merge:  copies take the block colour, seams settle, the
//                       outline jumps to the new size  (“solidify”)
//               settle: camera finishes framing the new blob
//    DOWN k→m   mark:   the b strips are shown; the extras grey out
//               fold:   extras fold back under the survivor, camera follows
//               settle
//  A multi-step jump chains compressed steps and plays the last at full
//  length.  If the user zooms or pans, `follow` turns off and the camera
//  is theirs until they press Fit (or change the exponent).
// ═══════════════════════════════════════════════════════════════
class Field {
  constructor(canvas, emit) {
    this.cv = canvas; this.ctx = canvas.getContext("2d"); this.emit = emit;
    this.b = CFG.BASE_INIT; this.n = 0; this.target = 0;
    this.theme = makeTheme(this.b);
    this.anim = null; this.journey = null; this.speed = 1;
    this.opts = { layers: false, numbers: true, history: true };
    this.cam = { x: 0.5, y: 0.5, s: 100 }; this.follow = true;
    this.W = 1; this.H = 1; this.dpr = 1; this.sized = false; this.dirty = true;
    this.ptrs = new Map(); this.lastEmit = "";
    this.tick = this.tick.bind(this);
    this.listen();
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.tick);
  }

  destroy() { cancelAnimationFrame(this.raf); this.unlisten(); }

  // ── public API ───────────────────────────────────────────────
  resize(w, h) {
    this.dpr = window.devicePixelRatio || 1;
    this.W = Math.max(1, w); this.H = Math.max(1, h);
    this.cv.width = Math.round(this.W * this.dpr); this.cv.height = Math.round(this.H * this.dpr);
    if (!this.sized) { this.sized = true; Object.assign(this.cam, this.fitTo(dims(this.b, this.n))); }
    this.dirty = true;
  }
  setBase(b, n) {
    this.b = b; this.n = this.target = n; this.anim = null; this.journey = null;
    this.theme = makeTheme(b); this.follow = true;
    Object.assign(this.cam, this.fitTo(dims(b, n)));
    this.dirty = true; this.emitState();
  }
  setTarget(n) { this.target = n; this.follow = true; this.journey = null; this.emitState(); }
  setOpts(o)   { Object.assign(this.opts, o); this.dirty = true; }
  setSpeed(s)  { this.speed = s; }
  recenter()   { this.follow = true; this.journey = null; this.emitState(); }
  zoomBy(f)    { this.zoomAt(this.W / 2, this.H / 2, f); }
  replay() {
    if (this.anim || this.n === 0) return;
    this.follow = false; this.journey = { stage: "dive", t: 0, k: 0 };
    this.emitState();
  }

  // ── state → React ────────────────────────────────────────────
  phaseInfo() {
    const a = this.anim;
    if (!a) return { phase: "idle", live: this.n, from: this.n, to: this.n, fast: false };
    const [s0, s1] = a.dir > 0 ? CFG.UP_SPLIT : CFG.DN_SPLIT;
    const i = a.p < s0 ? 0 : a.p < s1 ? 1 : 2;
    const phase = (a.dir > 0 ? ["copy", "merge", "settle"] : ["mark", "fold", "settle"])[i];
    return { phase, live: i === 0 ? a.from : a.to, from: a.from, to: a.to, fast: a.fast };
  }
  emitState() {
    const s = { ...this.phaseInfo(), n: this.n, follow: this.follow,
                replay: this.journey ? this.journey.k : null };
    const key = JSON.stringify(s);
    if (key !== this.lastEmit) { this.lastEmit = key; this.emit(s); }
  }

  // ── timeline ─────────────────────────────────────────────────
  startStep() {
    const dir = Math.sign(this.target - this.n), rem = Math.abs(this.target - this.n);
    const f = rem <= 1 ? 1 : Math.max(CFG.FAST_MIN, 0.35 / Math.pow(rem - 1, 0.8));
    this.anim = { dir, from: this.n, to: this.n + dir, p: 0, fast: rem > 1,
                  dur: (dir > 0 ? CFG.T_UP : CFG.T_DN) * f / this.speed };
    this.journey = null;
  }

  tick(now) {
    this.raf = requestAnimationFrame(this.tick);
    const dt = Math.min(50, now - this.last); this.last = now;
    let busy = this.dirty;

    if (!this.anim && this.target !== this.n) this.startStep();
    const a = this.anim;
    if (a) {
      busy = true;
      // Heading the other way now?  Finish this step quickly, then turn round.
      const reversing = (this.target - a.to) * a.dir < 0;
      a.p = Math.min(1, a.p + (dt / a.dur) * (reversing ? 3 : 1));
      if (a.p >= 1) {
        this.n = a.to; this.anim = null;
        if (this.target !== this.n) this.startStep();
      }
      this.emitState();
    }

    if (this.journey) { busy = true; this.stepJourney(dt); }
    else if (this.follow) {
      const tau = this.anim && this.anim.fast ? CFG.CAM_TAU_FAST : CFG.CAM_TAU;
      if (this.approach(this.followTarget(), dt, tau)) busy = true;
    }
    if (busy) { this.draw(); this.dirty = false; }
  }

  // ── camera ───────────────────────────────────────────────────
  fitTo(d) {
    const pad = Math.max(24, Math.min(this.W, this.H) * CFG.FIT_PAD);
    const s = Math.min((this.W - 2 * pad) / d.w, (this.H - 2 * pad) / d.h);
    return { x: d.w / 2, y: d.h / 2, s: Math.max(1e-9, s) };
  }
  // Ease toward tg: scale in log space, and the target centre's *screen*
  // offset decays — so even a 10⁶× zoom change stays visually smooth.
  approach(tg, dt, tau) {
    const c = this.cam, k = 1 - Math.exp(-dt / tau);
    const ls = Math.log(c.s), lt = Math.log(tg.s);
    const s2 = Math.exp(ls + (lt - ls) * k);
    const dx = (tg.x - c.x) * c.s, dy = (tg.y - c.y) * c.s;
    c.x = tg.x - (dx * (1 - k)) / s2; c.y = tg.y - (dy * (1 - k)) / s2; c.s = s2;
    return Math.abs(lt - ls) > 1e-4 || Math.hypot(dx, dy) > 0.3;
  }
  followTarget() {
    const a = this.anim, b = this.b;
    if (!a) return this.fitTo(dims(b, this.n));
    const big = a.dir > 0 ? a.to : a.from, d = dims(b, big - 1);
    const [s0, s1] = a.dir > 0 ? CFG.UP_SPLIT : CFG.DN_SPLIT;
    // Going up the camera leads the copies; going down it trails the fold.
    const q = a.dir > 0 ? EASE.out(seg(a.p, 0, s0 * 0.8)) : 1 - EASE.inOut(seg(a.p, s0, s1));
    const g = 1 + (b - 1) * q;
    return this.fitTo(growsX(big) ? { w: d.w * g, h: d.h } : { w: d.w, h: d.h * g });
  }
  // Continuous stage u ∈ [0, n]: the growing axis scales by b^frac.
  extentAt(u) {
    const k = Math.floor(u), f = u - k, d = dims(this.b, k);
    if (f > 0) { if (growsX(k + 1)) d.w *= Math.pow(this.b, f); else d.h *= Math.pow(this.b, f); }
    return d;
  }
  // Replay: dive into the seed cell, pause, then pull back through every stage.
  stepJourney(dt) {
    const j = this.journey, n = this.n;
    if (j.stage === "dive") {
      const tg = this.fitTo(dims(this.b, 0));
      const moving = this.approach(tg, dt, 200);
      if (!moving || Math.abs(Math.log(this.cam.s / tg.s)) < 0.01) { j.stage = "hold"; j.t = 0; }
    } else if (j.stage === "hold") {
      j.t += dt;
      if (j.t > 500) { j.stage = "rise"; j.t = 0; }
    } else {
      const T = Math.min(14000, 900 + n * 900) / this.speed;
      j.t += dt;
      const u = EASE.inOut(clamp01(j.t / T)) * n;
      Object.assign(this.cam, this.fitTo(this.extentAt(u)));
      j.k = Math.min(n, Math.floor(u + 1e-6));
      if (j.t >= T) { this.journey = null; this.follow = true; }
    }
    this.emitState();
  }
  zoomAt(px, py, f) {
    const c = this.cam;
    const sMin = this.fitTo(dims(this.b, Math.max(this.n, this.target))).s / 30;
    const s2 = Math.min(CFG.ZOOM_IN_MAX, Math.max(sMin, c.s * f));
    const ox = px - this.W / 2, oy = py - this.H / 2;
    const wx = c.x + ox / c.s, wy = c.y + oy / c.s;
    c.x = wx - ox / s2; c.y = wy - oy / s2; c.s = s2;
    this.userMoved();
  }
  userMoved() {
    if (this.follow || this.journey) { this.follow = false; this.journey = null; this.emitState(); }
    this.dirty = true;
  }

  // ── input: wheel / drag / pinch / double-click ───────────────
  listen() {
    const cv = this.cv, rect = () => cv.getBoundingClientRect();
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    this.h = {
      wheel: e => {
        e.preventDefault();
        const r = rect(), dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
        this.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-dy * 0.0016));
      },
      down: e => { cv.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); },
      move: e => {
        const p = this.ptrs.get(e.pointerId);
        if (!p) return;
        const c = this.cam;
        if (this.ptrs.size === 1) {
          c.x -= (e.clientX - p.x) / c.s; c.y -= (e.clientY - p.y) / c.s;
          p.x = e.clientX; p.y = e.clientY;
          this.userMoved();
        } else if (this.ptrs.size === 2) {
          const [a, b] = [...this.ptrs.values()];
          const d0 = Math.hypot(a.x - b.x, a.y - b.y), m0 = mid(a, b);
          p.x = e.clientX; p.y = e.clientY;
          const d1 = Math.hypot(a.x - b.x, a.y - b.y), m1 = mid(a, b), r = rect();
          c.x -= (m1.x - m0.x) / c.s; c.y -= (m1.y - m0.y) / c.s;
          this.zoomAt(m1.x - r.left, m1.y - r.top, d1 / Math.max(1, d0));
        }
      },
      up:  e => { this.ptrs.delete(e.pointerId); },
      dbl: () => this.recenter(),
    };
    cv.addEventListener("wheel", this.h.wheel, { passive: false });
    cv.addEventListener("pointerdown", this.h.down);
    cv.addEventListener("pointermove", this.h.move);
    cv.addEventListener("pointerup", this.h.up);
    cv.addEventListener("pointercancel", this.h.up);
    cv.addEventListener("dblclick", this.h.dbl);
  }
  unlisten() {
    const cv = this.cv;
    cv.removeEventListener("wheel", this.h.wheel);
    cv.removeEventListener("pointerdown", this.h.down);
    cv.removeEventListener("pointermove", this.h.move);
    cv.removeEventListener("pointerup", this.h.up);
    cv.removeEventListener("pointercancel", this.h.up);
    cv.removeEventListener("dblclick", this.h.dbl);
  }

  // ── drawing primitives ───────────────────────────────────────
  X(x) { return (x - this.cam.x) * this.cam.s + this.W / 2; }
  Y(y) { return (y - this.cam.y) * this.cam.s + this.H / 2; }
  view() {
    const c = this.cam, hw = this.W / 2 / c.s, hh = this.H / 2 / c.s;
    return { x0: c.x - hw, x1: c.x + hw, y0: c.y - hh, y1: c.y + hh };
  }
  // World rect → screen rect clipped to just outside the canvas (huge
  // blobs would otherwise hand the canvas coordinates in the billions).
  scr(x, y, w, h, m) {
    let x0 = this.X(x), y0 = this.Y(y), x1 = this.X(x + w), y1 = this.Y(y + h);
    if (x1 < -m || y1 < -m || x0 > this.W + m || y0 > this.H + m) return null;
    x0 = Math.max(x0, -m); y0 = Math.max(y0, -m);
    x1 = Math.min(x1, this.W + m); y1 = Math.min(y1, this.H + m);
    return [x0, y0, x1 - x0, y1 - y0];
  }
  fillW(x, y, w, h, color, alpha = 1) {
    if (alpha <= 0.004) return;
    const r = this.scr(x, y, w, h, 2);
    if (!r) return;
    const ctx = this.ctx;
    ctx.globalAlpha = alpha; ctx.fillStyle = rgba(color);
    ctx.fillRect(r[0], r[1], r[2], r[3]);
    ctx.globalAlpha = 1;
  }
  strokeW(x, y, w, h, color, alpha, lw, glow = 0) {
    if (alpha <= 0.004) return;
    const r = this.scr(x, y, w, h, 40);
    if (!r) return;
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = alpha; ctx.strokeStyle = rgba(color); ctx.lineWidth = lw;
    if (glow > 0) { ctx.shadowColor = rgba(this.theme.rgb.accent, 0.9); ctx.shadowBlur = glow; }
    ctx.strokeRect(r[0], r[1], r[2], r[3]);
    ctx.restore();
  }

  // World-aligned dot lattice at powers of b — two adjacent levels
  // cross-fade, so zooming never runs out of texture.
  drawDots() {
    const b = this.b, s = this.cam.s, BASE_PX = 22;
    const i = Math.ceil(Math.log(BASE_PX / s) / Math.log(b));
    const fine = Math.pow(b, i);
    this.dotLayer(fine, 0.3 * smooth(BASE_PX, BASE_PX * b, fine * s));
    this.dotLayer(fine * b, 0.3);
  }
  dotLayer(sp, alpha) {
    if (alpha < 0.01) return;
    const ctx = this.ctx, v = this.view();
    ctx.fillStyle = this.theme.a("accent", alpha);
    for (let gx = Math.ceil(v.x0 / sp) * sp; gx <= v.x1; gx += sp) {
      const X = this.X(gx);
      for (let gy = Math.ceil(v.y0 / sp) * sp; gy <= v.y1; gy += sp) ctx.fillRect(X - 0.75, this.Y(gy) - 0.75, 1.5, 1.5);
    }
  }

  // Seams inside a stage-n block at (ox,oy): cell gaps plus thicker lines
  // at every block boundary (bⁱ cells apart).  Each level fades in once its
  // spacing is a few pixels, and only lines in view are drawn.
  gridLines(ox, oy, n, alpha = 1) {
    if (n === 0 || alpha <= 0.004) return;
    const { b, ctx } = this, s = this.cam.s, d = dims(b, n), v = this.view();
    const rx0 = Math.max(ox, v.x0), rx1 = Math.min(ox + d.w, v.x1);
    const ry0 = Math.max(oy, v.y0), ry1 = Math.min(oy + d.h, v.y1);
    if (rx0 >= rx1 || ry0 >= ry1) return;
    ctx.strokeStyle = this.theme.bg;
    const pass = (levels, vertical) => {
      for (let i = 0; i < levels; i++) {
        const sp = Math.pow(b, i), px = sp * s;
        if (px < 3) continue;
        const lo = vertical ? rx0 - ox : ry0 - oy, hi = vertical ? rx1 - ox : ry1 - oy;
        const j0 = Math.max(1, Math.ceil(lo / sp));
        const j1 = Math.min(Math.floor(hi / sp), (vertical ? d.w : d.h) / sp - 1);
        if (j1 < j0) continue;
        ctx.globalAlpha = alpha * smooth(3, 14, px);
        ctx.lineWidth = Math.min(1.5 + i * 0.75, Math.max(0.6, px * 0.05));
        ctx.beginPath();
        for (let j = j0; j <= j1; j++) {
          if (j % b === 0) continue;               // drawn by a coarser level
          if (vertical) { const X = this.X(ox + j * sp); ctx.moveTo(X, this.Y(ry0)); ctx.lineTo(X, this.Y(ry1)); }
          else          { const Y = this.Y(oy + j * sp); ctx.moveTo(this.X(rx0), Y); ctx.lineTo(this.X(rx1), Y); }
        }
        ctx.stroke();
      }
    };
    pass(Math.ceil(n / 2), true);
    pass(Math.floor(n / 2), false);
    ctx.globalAlpha = 1;
  }

  // When cells are big enough: each cell's count (1-based) and its
  // base-b address — digit ℓ = which copy it landed in at step ℓ.
  cellNumbers(ox, oy, n, off, digits, alpha = 1) {
    const s = this.cam.s;
    if (!this.opts.numbers || s < CFG.NUM_MIN_PX || alpha <= 0.01) return;
    const { b, ctx } = this, d = dims(b, n), v = this.view();
    const cx0 = Math.max(0, Math.floor(v.x0 - ox)), cx1 = Math.min(d.w, Math.ceil(v.x1 - ox));
    const cy0 = Math.max(0, Math.floor(v.y0 - oy)), cy1 = Math.min(d.h, Math.ceil(v.y1 - oy));
    if (cx1 <= cx0 || cy1 <= cy0 || (cx1 - cx0) * (cy1 - cy0) > 800) return;
    const a = alpha * smooth(CFG.NUM_MIN_PX, CFG.NUM_MIN_PX * 1.6, s);
    const fs = Math.min(s * 0.24, 34);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let cy = cy0; cy < cy1; cy++) for (let cx = cx0; cx < cx1; cx++) {
      const idx = off + cellIndex(b, cx, cy, n);
      const X = this.X(ox + cx + 0.5), Y = this.Y(oy + cy + 0.5);
      const addr = b !== 10 && digits > 0 ? idx.toString(b).padStart(digits, "0") + sub(b) : "";
      const fs2 = addr ? Math.min(fs * 0.55, (s * 0.84) / (addr.length * 0.62)) : 0;
      ctx.globalAlpha = a;
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = `500 ${fs}px ${CVFONT}`;
      ctx.fillText(fmt(idx + 1), X, fs2 >= 6 ? Y - fs * 0.35 : Y);
      if (fs2 >= 6) {
        ctx.globalAlpha = a * 0.6;
        ctx.font = `400 ${fs2}px ${CVFONT}`;
        ctx.fillText(addr, X, Y + fs * 0.5);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Fill a whole stage-n block: one rect, or one rect per generation.
  fillStage(n) {
    const { b } = this, T = this.theme;
    if (this.opts.layers) {
      for (let k = n; k >= 1; k--) {
        const d = dims(b, k - 1), gx = growsX(k);
        for (let j = 1; j < b; j++) this.fillW(gx ? j * d.w : 0, gx ? 0 : j * d.h, d.w, d.h, T.gen(k));
      }
      this.fillW(0, 0, 1, 1, T.gen(0));
    } else {
      const d = dims(b, n);
      this.fillW(0, 0, d.w, d.h, T.rgb.cell);
      // the seed — the one cell everything grew from
      this.fillW(0, 0, 1, 1, T.rgb.outline, 0.45 * smooth(4, 24, this.cam.s));
    }
  }

  // ── labels + outlines ────────────────────────────────────────
  textBox(text, x, y, fs, color, alpha, align) {
    const ctx = this.ctx;
    ctx.font = `500 ${fs}px ${CVFONT}`;
    const w = ctx.measureText(text).width, padX = 5, h = fs + 6;
    const left = align === "right" ? x - w - padX * 2 : x - w / 2 - padX;
    ctx.globalAlpha = alpha * 0.75; ctx.fillStyle = this.theme.bg;
    ctx.fillRect(left, y - h / 2, w + padX * 2, h);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(text, left + padX, y + 0.5);
    ctx.globalAlpha = 1;
  }
  // Label in the bottom-right corner of stage k.  The current stage's
  // label clamps into view so it never gets lost while zoomed in.
  stageLabel(k, alpha, main) {
    if (alpha <= 0.01) return;
    const { b } = this, s = this.cam.s, d = dims(b, k), wp = d.w * s, hp = d.h * s;
    if (Math.min(wp, hp) < (main ? 36 : 48)) return;
    let x = this.X(d.w), y = this.Y(d.h);
    if (main) {
      if (this.X(0) > this.W || this.Y(0) > this.H) return;
      x = Math.min(x, this.W); y = Math.min(y, this.H);
      if (x < 60 || y < 30) return;
    }
    else if (x > this.W + 2 || y > this.H + 2 || x < 0 || y < 0) return;
    const fs = main ? 14 : 11;
    const full = `${b}${sup(k)} = ${fmt(Math.pow(b, k))}`, short = `${b}${sup(k)}`;
    this.ctx.font = `500 ${fs}px ${CVFONT}`;
    const room = Math.min(wp, x) - 14;
    const text = this.ctx.measureText(full).width + 10 <= room ? full
               : this.ctx.measureText(short).width + 10 <= room ? short : null;
    if (!text || hp < fs + 14) return;
    // queued, so the current stage and bigger stages win any overlap
    this.labels.push({ text, x: x - 7, y: y - fs / 2 - 9, fs, alpha, prio: main ? 1e3 + k : k });
  }
  flushLabels() {
    const ctx = this.ctx, placed = [];
    this.labels.sort((p, q) => q.prio - p.prio);
    for (const l of this.labels) {
      ctx.font = `500 ${l.fs}px ${CVFONT}`;
      const w = ctx.measureText(l.text).width + 14, h = l.fs + 8;
      const box = [l.x - w, l.y - h / 2, l.x, l.y + h / 2];
      if (placed.some(o => box[0] < o[2] && box[2] > o[0] && box[1] < o[3] && box[3] > o[1])) continue;
      placed.push(box);
      this.textBox(l.text, l.x, l.y, l.fs, this.theme.outline, l.alpha, "right");
    }
    this.labels = [];
  }
  drawHistory(upTo) {
    if (!this.opts.history) return;
    const s = this.cam.s;
    for (let k = 0; k <= upTo; k++) {
      const d = dims(this.b, k), a = 0.5 * smooth(10, 50, Math.min(d.w, d.h) * s);
      if (a <= 0.01) continue;
      this.strokeW(0, 0, d.w, d.h, this.theme.rgb.outline, a, 1);
      this.stageLabel(k, Math.min(1, a * 1.6), false);
    }
  }
  strong(k, alpha, glow) {
    if (alpha <= 0.01) return;
    const d = dims(this.b, k);
    this.strokeW(0, 0, d.w, d.h, this.theme.rgb.outline, alpha, 2.5, 14 + glow);
    this.stageLabel(k, alpha, true);
  }
  copyLabel(x, y, d, k, alpha) {
    const s = this.cam.s, wp = d.w * s, hp = d.h * s;
    if (alpha <= 0.01 || Math.min(wp, hp) < 26 || s >= CFG.NUM_MIN_PX) return;
    const fs = Math.max(10, Math.min(22, Math.min(wp, hp) * 0.2));
    const big = `${this.b}${sup(k)}`, val = fmt(Math.pow(this.b, k));
    const cx = this.X(x + d.w / 2), cy = this.Y(y + d.h / 2);
    this.ctx.font = `500 ${fs}px ${CVFONT}`;
    const text = this.ctx.measureText(val).width + 12 < wp && k > 0 ? val : big;
    this.textBox(text, cx, cy, fs, "rgba(255,255,255,0.95)", alpha, "center");
  }

  // ── frames ───────────────────────────────────────────────────
  draw() {
    const { ctx, W, H, dpr } = this;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.fillStyle = this.theme.bg; ctx.fillRect(0, 0, W, H);
    this.drawDots();
    this.labels = [];
    const a = this.anim;
    if (!a) this.drawSettled();
    else if (a.dir > 0) this.drawUp(a);
    else this.drawDown(a);
    this.flushLabels();
  }

  drawSettled() {
    const n = this.n;
    this.fillStage(n);
    this.gridLines(0, 0, n);
    this.cellNumbers(0, 0, n, 0, n);
    this.drawHistory(n - 1);
    this.strong(n, 1, 0);
  }

  // Copies are drawn *under* the original, so they appear to slide out
  // from beneath it (up) and tuck back beneath it (down).
  drawUp(a) {
    const { b } = this, T = this.theme.rgb, m = a.from, k = a.to, [s0, s1] = CFG.UP_SPLIT;
    const d = dims(b, m), gx = growsX(k), S = gx ? d.w : d.h, bm = Math.pow(b, m);
    const pc = seg(a.p, 0, s0), pm = seg(a.p, s0, s1);
    const q = EASE.inOut(pc), mg = EASE.inOut(pm), appear = smooth(0, 0.18, pc);
    const col = mix(T.fresh, this.opts.layers ? this.theme.gen(k) : T.cell, mg);
    for (let j = b - 1; j >= 1; j--) {
      const off = j * S * q, x = gx ? off : 0, y = gx ? 0 : off;
      this.fillW(x, y, d.w, d.h, col, appear);
      if (pm === 0) { this.gridLines(x, y, m, appear); this.cellNumbers(x, y, m, j * bm, k, appear); }
      this.strokeW(x, y, d.w, d.h, T.fresh, appear * (1 - mg), 1.5);
      this.copyLabel(x, y, d, m, appear * (1 - mg));
    }
    this.fillStage(m);
    if (pm === 0) { this.gridLines(0, 0, m); this.cellNumbers(0, 0, m, 0, k); }
    else          { this.gridLines(0, 0, k); this.cellNumbers(0, 0, k, 0, k); }
    this.copyLabel(0, 0, d, m, appear * (1 - mg));
    this.drawHistory(m);
    this.strong(m, 1 - mg, 0);
    this.strong(k, mg, 22 * Math.sin(Math.PI * mg));
  }

  drawDown(a) {
    const { b } = this, T = this.theme.rgb, m = a.to, k = a.from, [s0, s1] = CFG.DN_SPLIT;
    const d = dims(b, m), gx = growsX(k), S = gx ? d.w : d.h, bm = Math.pow(b, m);
    const pk = seg(a.p, 0, s0), pf = seg(a.p, s0, s1);
    const mk = EASE.inOut(pk), q = 1 - EASE.inOut(pf), fade = 1 - smooth(0.65, 1, pf);
    const col = mix(this.opts.layers ? this.theme.gen(k) : T.cell, T.gone, mk);
    for (let j = b - 1; j >= 1; j--) {
      const off = j * S * q, x = gx ? off : 0, y = gx ? 0 : off;
      this.fillW(x, y, d.w, d.h, col, fade);
      if (pf > 0) { this.gridLines(x, y, m, fade); this.cellNumbers(x, y, m, j * bm, k, fade); }
      this.strokeW(x, y, d.w, d.h, T.outline, mk * fade * 0.6, 1.2);
      this.copyLabel(x, y, d, m, mk * fade * 0.8);
    }
    this.fillStage(m);
    if (pf === 0) { this.gridLines(0, 0, k); this.cellNumbers(0, 0, k, 0, k); }
    else          { this.gridLines(0, 0, m); this.cellNumbers(0, 0, m, 0, m); }
    this.copyLabel(0, 0, d, m, mk * (1 - pf));
    this.drawHistory(m);
    this.strong(k, 1 - mk, 0);
    this.strong(m, mk, 18 * Math.sin(Math.PI * mk));
  }
}

// ═══════════════════════════════════════════════════════════════
//  § 5  MATH ROW
// ═══════════════════════════════════════════════════════════════
function stepText(b, st) {
  const { phase, from, to } = st;
  const sm = Math.pow(b, Math.min(from, to)), sb = Math.pow(b, Math.max(from, to));
  const sum = () => b <= 4 && fmt(sm).length <= 9
    ? Array.from({ length: b }, () => fmt(sm)).join(" + ")
    : `${b} copies of ${fmt(sm)}`;
  switch (phase) {
    case "copy":   return sum();
    case "merge":
    case "settle": return from < to ? `${b} × ${fmt(sm)} = ${fmt(sb)}` : `${fmt(sb)} ÷ ${b} = ${fmt(sm)}`;
    case "mark":   return `${fmt(sb)} = ${sum()}`;
    case "fold":   return `${fmt(sb)} ÷ ${b} = ${fmt(sm)}`;
    default:       return "";
  }
}

function MathRow({ base, st, theme }) {
  const e   = st.replay ?? st.live;
  const now = Math.pow(base, e);
  const sub = st.replay != null ? "replaying growth…" : stepText(base, st);
  const hot = ["merge", "fold"].includes(st.phase);
  const nm  = named(now);
  return (
    <div style={{ textAlign: "center" }}>
      <div style={{
        fontSize: "clamp(22px,4.2vw,38px)", fontFamily: DISP, color: "#f8fafc",
        textShadow: `0 0 22px ${theme.a("accent", 0.35)}`, userSelect: "none", lineHeight: 1.1,
      }}>
        <span style={{ color: theme.accent }}>{base}</span>
        <sup style={{ fontSize: "0.52em", verticalAlign: "super", color: theme.outline }}>{e}</sup>
        <span style={{ color: "#4b5d73", fontSize: "0.5em", margin: "0 8px" }}>=</span>
        <span style={{ color: "#f1f5f9", fontSize: "0.56em" }}>{fmt(now)}</span>
      </div>
      <div style={{ height: 18, fontFamily: FONT, fontSize: 11, color: "#5b6b80", marginTop: 3 }}>
        {nm && <>≈ {nm} · {sci(now)}</>}
      </div>
      <div style={{
        fontFamily: FONT, fontSize: 12, letterSpacing: "0.04em", height: 20, marginTop: 2,
        color: hot ? theme.outline : theme.a("accent", 0.6), fontWeight: hot ? 600 : 400,
        display: "flex", alignItems: "center", justifyContent: "center",
        opacity: sub ? 1 : 0, transition: "opacity 0.3s, color 0.3s", whiteSpace: "nowrap",
      }}>{sub || "·"}</div>
    </div>
  );
}

const SERIES = [
  { href: "index.html",   label: "Exponents",   tag: "bⁿ" },
  { href: "uparrow.html", label: "Up-arrows",   tag: "a↑↑n" },
  { href: "numberline.html", label: "Number line", tag: "you are here" },
];

const PAGES = [
  { href: "index.html", label: "Exponents" },
  { href: "uparrow.html", label: "Up-arrows" },
  { href: "numberline.html", label: "Number line" },
];
function PageSwitch({ current, color, line }) {

          padding: "5px 10px", textDecoration: "none", whiteSpace: "nowrap",

        }}>{p.label}</a>

}

function EdgeArrows({ current, color }) {
  const arrow = (p, side) => {
    if (!p) return null;
    const st = {
      position: "fixed", top: "50%", [side]: 14, transform: "translateY(-50%)", zIndex: 30,
      display: "flex", flexDirection: "column", alignItems: "center", gap: 6, textDecoration: "none",
      fontFamily: FONT, fontSize: 10, color: p.href ? color : "#4b5d73", opacity: p.href ? 1 : 0.6,
    };
    const circle = (
      <span style={{
        width: 46, height: 46, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 22, border: `2px solid ${p.href ? color : "#1e2d3d"}`, background: "rgba(10,16,32,.85)",
      }}>{side === "left" ? "‹" : "›"}</span>
    );
    const text = <span style={{ textAlign: "center", lineHeight: 1.3 }}>{p.label}<br /><span style={{ opacity: 0.6 }}>{p.tag}</span></span>;

      ? <a key={side} href={p.href} className="edge-arrow" style={st}>{circle}{text}</a>
      : <span key={side} className="edge-arrow" style={st}>{circle}{text}</span>;
  };
  return <>{arrow(SERIES[current - 1], "left")}{arrow(SERIES[current + 1], "right")}</>;
}


// ═══════════════════════════════════════════════════════════════
//  § 7  APP
// ═══════════════════════════════════════════════════════════════
const CAPTION = {
  idle:   "Every earlier stage is still in there. Zoom into the bright seed cell in the top-left corner to travel back in time.",
  copy:   "Make copies: the block unfolds into b identical strips, side by side.",
  merge:  "Solidify: the copies fuse into one new block, b times bigger.",
  settle: "The new block becomes the starting point for the next step.",
  mark:   "Split: the block is really b copies of the previous stage.",
  fold:   "Fold away: the extra copies tuck back under the first one.",
  replay: "Replaying: starting from the single seed cell, every step multiplies by the base.",
};

function readParams() {
  const q = new URLSearchParams(location.search);
  let b = parseInt(q.get("base"), 10), n = parseInt(q.get("exp"), 10);
  if (!(b >= CFG.BASE_MIN && b <= CFG.BASE_MAX)) b = CFG.BASE_INIT;
  if (!(n >= 0)) n = CFG.EXP_INIT;
  return { b, n: Math.min(n, expMax(b)) };
}

function App() {
  const [init] = useState(readParams);
  const [base, setBase]     = useState(init.b);
  const [target, setTarget] = useState(init.n);
  const [st, setSt] = useState({ phase: "idle", live: init.n, from: init.n, to: init.n, n: init.n, follow: true, replay: null });
  const [opts, setOpts]   = useState({ layers: false, numbers: true, history: true });
  const [speed, setSpeed] = useState(1);
  const [menu, setMenu]   = useState(false);
  const cvRef = useRef(null), wrapRef = useRef(null), eng = useRef(null);
  const ctl = useRef({});

  const theme  = makeTheme(base);
  const maxExp = expMax(base);
  const dimNow = dims(base, st.replay ?? st.live);

  useEffect(() => {
    const e = new Field(cvRef.current, setSt);
    eng.current = e;
    e.setBase(init.b, init.n);
    const ro = new ResizeObserver(([en]) => e.resize(en.contentRect.width, en.contentRect.height));
    ro.observe(wrapRef.current);
    if (document.fonts) document.fonts.ready.then(() => { e.dirty = true; });
    return () => { ro.disconnect(); e.destroy(); };
  }, []);
  useEffect(() => { eng.current && eng.current.setOpts(opts); }, [opts]);
  useEffect(() => { eng.current && eng.current.setSpeed(speed); }, [speed]);
  useEffect(() => {
    if (st.phase !== "idle") return;
    try { history.replaceState(null, "", `?base=${base}&exp=${st.n}`); } catch (_) { /* file:// */ }
  }, [st.phase, st.n, base]);

  function changeExp(n) {
    n = Math.max(0, Math.min(maxExp, n));
    setTarget(n); eng.current.setTarget(n);
  }
  function changeBase(b) {
    const n = Math.min(target, expMax(b));
    setBase(b); setTarget(n); eng.current.setBase(b, n);
  }
  ctl.current = { changeExp, target };

  useEffect(() => {
    const onKey = e => {
      if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
      const { changeExp, target } = ctl.current, E = eng.current;
      if (["ArrowRight", "ArrowUp", "+", "="].includes(e.key)) { e.preventDefault(); changeExp(target + 1); }
      else if (["ArrowLeft", "ArrowDown", "-", "_"].includes(e.key)) { e.preventDefault(); changeExp(target - 1); }
      else if (e.key === "f" || e.key === "F") E.recenter();
      else if (e.key === "r" || e.key === "R") E.replay();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const busy    = st.phase !== "idle";
  const opLabel = busy ? (st.to > st.from ? `×${base}` : `÷${base}`) : "";
  const caption = st.replay != null ? CAPTION.replay : (CAPTION[st.phase] || CAPTION.idle).replace(/\bb\b/g, String(base));
  const toolStyle = { color: theme.outline, border: `1px solid ${theme.a("accent", 0.3)}` };

  return (
    <div style={{
      minHeight: "100vh", background: "#0a1020", color: "#e2e8f0", fontFamily: FONT,
      display: "flex", flexDirection: "column", alignItems: "center", padding: "16px 16px 28px",
    }}>
      {/* Header */}
      <div style={{ width: "min(880px,100%)", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 10, position: "relative" }}>
        <div style={{ flex: 1 }}>
          <div style={{
            fontFamily: DISP, fontSize: "clamp(20px,3.6vw,28px)", color: theme.outline, transition: "color 0.4s",
            textShadow: `0 0 20px ${theme.a("accent", 0.3)}`,
          }}>Exponential Powers</div>
          <div style={{ fontSize: 9, color: "#4b5d73", marginTop: 2, letterSpacing: "0.09em", textTransform: "uppercase" }}>
            b<sup>n</sup> as a field that keeps folding outward
          </div>
        </div>
        <div style={{ marginRight: 8 }}><PageSwitch current={0} color={theme.outline} line={theme.a("accent", 0.35)} /></div>
        <button className="tool" onClick={() => setMenu(m => !m)} title="Settings" style={{ ...toolStyle, fontSize: 15, padding: "0 9px", position: "relative", zIndex: 60 }}>⚙</button>
        {menu && <SettingsMenu theme={theme} opts={opts} setOpts={setOpts} speed={speed} setSpeed={setSpeed} onClose={() => setMenu(false)} />}
      </div>

      <EdgeArrows current={0} color={theme.outline} />

      {/* Base tabs */}
      <div style={{
        maxWidth: "100%", overflowX: "auto", display: "flex", alignItems: "center", gap: 3,
        background: "#131e2e", padding: 4, borderRadius: 10, marginBottom: 10,
      }}>
        {Array.from({ length: CFG.BASE_MAX - CFG.BASE_MIN + 1 }, (_, i) => i + CFG.BASE_MIN).map(b => {
          const t = makeTheme(b);
          return (
            <button key={b} className="bt" onClick={() => changeBase(b)} style={{
              fontFamily: FONT, fontSize: 11, fontWeight: 500, whiteSpace: "nowrap",
              padding: "4px 9px", borderRadius: 7, height: 28,
              background: base === b ? t.cell : "transparent",
              color: base === b ? "#fff" : "#64748b",
              boxShadow: base === b ? `0 0 11px ${t.a("accent", 0.3)}` : "none",
            }}>base {b}</button>
          );
        })}
      </div>

      {/* Field */}
      <div ref={wrapRef} style={{
        width: "min(880px,100%)", height: "clamp(300px,58vh,620px)", position: "relative",
        background: theme.bg, borderRadius: 18, overflow: "hidden",
        border: `1.5px solid ${theme.a("accent", 0.12)}`,
        boxShadow: `0 0 32px ${theme.a("accent", 0.07)}, inset 0 0 24px #00000066`,
      }}>
        <canvas ref={cvRef} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", touchAction: "none", cursor: "grab" }} />

        <div style={{ position: "absolute", top: 10, left: 12, fontSize: 10, color: theme.accent, opacity: 0.55, letterSpacing: "0.07em", pointerEvents: "none" }}>
          {fmt(dimNow.w)} × {fmt(dimNow.h)}
        </div>
        <div style={{ position: "absolute", top: 10, right: 12, fontSize: 12, fontWeight: 600, color: theme.outline, pointerEvents: "none", opacity: opLabel ? 0.8 : 0, transition: "opacity 0.2s" }}>
          {opLabel || "·"}
        </div>

        {!st.follow && st.replay == null && (
          <button className="tool" onClick={() => eng.current.recenter()} style={{
            ...toolStyle, position: "absolute", top: 10, left: "50%", transform: "translateX(-50%)",
          }}>⌖ re-center</button>
        )}

        <div style={{ position: "absolute", left: 10, bottom: 10, display: "flex", gap: 6 }}>
          <button className="tool" style={toolStyle} title="Zoom in"  onClick={() => eng.current.zoomBy(1.6)}>＋</button>
          <button className="tool" style={toolStyle} title="Zoom out" onClick={() => eng.current.zoomBy(1 / 1.6)}>－</button>
          <button className="tool" style={toolStyle} title="Fit (F)" onClick={() => eng.current.recenter()}>⤢ fit</button>
          <button className="tool" style={{ ...toolStyle, opacity: busy || st.n === 0 ? 0.4 : 1 }} title="Replay growth from the seed (R)"
                  onClick={() => eng.current.replay()}>▶ replay growth</button>
        </div>
      </div>

      {/* Exponent control */}
      <div style={{ width: "min(560px,100%)", display: "flex", alignItems: "center", gap: 12, margin: "14px 0 6px" }}>
        <NavBtn label="−" title="Divide by the base" onClick={() => changeExp(target - 1)} disabled={target === 0} theme={theme} />
        <div style={{ flex: 1 }}>
          <input type="range" className="exp" min={0} max={maxExp} value={target}
            onChange={e => changeExp(+e.target.value)}
            style={{
              width: "100%", "--thumb": theme.cell, "--thumb-edge": theme.outline,
              background: `linear-gradient(90deg, ${theme.cell} ${(target / maxExp) * 100}%, #1a2535 ${(target / maxExp) * 100}%)`,
            }} />
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "#4b5d73", marginTop: 4 }}>
            <span>{base}⁰ = 1</span>
            <span style={{ color: theme.outline }}>exponent {target}</span>
            <span>{base}{sup(maxExp)}</span>
          </div>
        </div>
        <NavBtn label="+" title="Multiply by the base" onClick={() => changeExp(target + 1)} disabled={target === maxExp} theme={theme} />
      </div>

      {/* Math */}
      <div style={{ minHeight: 92, display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <MathRow base={base} st={st} theme={theme} />
      </div>

      {/* Caption */}
      <div style={{
        width: "min(560px,100%)", minHeight: 50, background: "#0e1828", borderRadius: 10, padding: "10px 16px",
        border: `1px solid ${theme.a("accent", 0.18)}`, fontSize: 11, color: "#8193a8", lineHeight: 1.55, textAlign: "center",
      }}>{caption}</div>

      <div style={{ fontSize: 9, color: "#334155", letterSpacing: "0.08em", marginTop: 12 }}>
        scroll / pinch to zoom · drag to pan · ← → to step · F to fit · R to replay
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  § 8  MOUNT
// ═══════════════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
